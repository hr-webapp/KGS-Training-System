<style>
:root{--f:'Inter','Noto Sans Lao',system-ui,sans-serif;--radius:16px;color-scheme:dark;
--ink:#eaf0fa;--muted:#9aa8c0;--line:rgba(255,255,255,.14);--line2:rgba(255,255,255,.07);
--glass:rgba(255,255,255,.065);--glass2:rgba(255,255,255,.11);--glass-strong:rgba(16,24,46,.78);--field:rgba(255,255,255,.06);--opt-bg:#16213d;
--brand:#38bdf8;--brand2:#0ea5e9;--brandg:linear-gradient(135deg,#38bdf8 0%,#2563eb 100%);--glow:0 6px 24px rgba(56,189,248,.35);
--danger:#f87171;--warn:#fbbf24;--ok:#34d399;--info:#60a5fa;--shadow:0 12px 40px rgba(0,0,0,.35);--blur:saturate(160%) blur(18px);
--bgimg:radial-gradient(1100px 700px at 8% 8%,rgba(56,189,248,.30),transparent 60%),radial-gradient(900px 650px at 92% 12%,rgba(139,92,246,.28),transparent 60%),radial-gradient(1000px 700px at 75% 100%,rgba(16,185,129,.20),transparent 60%),radial-gradient(700px 500px at 20% 95%,rgba(236,72,153,.14),transparent 60%),linear-gradient(160deg,#0b1532 0%,#060a1a 100%)}
:root[data-theme=light]{color-scheme:light;--ink:#15213b;--muted:#5d6b84;--line:rgba(255,255,255,.75);--line2:rgba(21,33,59,.08);
--glass:rgba(255,255,255,.52);--glass2:rgba(255,255,255,.72);--glass-strong:rgba(255,255,255,.88);--field:rgba(255,255,255,.7);--opt-bg:#fff;
--brand:#2563eb;--brand2:#1d4ed8;--brandg:linear-gradient(135deg,#3b82f6 0%,#1d4ed8 100%);--glow:0 6px 20px rgba(37,99,235,.28);
--danger:#dc2626;--warn:#b45309;--ok:#059669;--info:#2563eb;--shadow:0 10px 30px rgba(30,60,120,.14);
--bgimg:radial-gradient(1100px 700px at 5% 0%,rgba(125,211,252,.55),transparent 60%),radial-gradient(900px 650px at 95% 10%,rgba(196,181,253,.45),transparent 60%),radial-gradient(1000px 700px at 70% 100%,rgba(253,186,116,.35),transparent 60%),linear-gradient(160deg,#dce8f7 0%,#f2f5fb 100%)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:var(--f);font-size:14px;color:var(--ink);background:var(--bgimg);background-attachment:fixed}
button,input,select,textarea{font-family:inherit;font-size:14px;color:inherit}
a{color:var(--brand)}
:root[data-theme=light][data-tone=mint]{--brand:#0f9f6e;--brand2:#047857;--brandg:linear-gradient(135deg,#34d399 0%,#059669 100%);--glow:0 6px 20px rgba(5,150,105,.28);
--bgimg:radial-gradient(1100px 700px at 5% 0%,rgba(110,231,183,.55),transparent 60%),radial-gradient(900px 650px at 95% 10%,rgba(103,232,249,.45),transparent 60%),radial-gradient(1000px 700px at 70% 100%,rgba(190,242,100,.30),transparent 60%),linear-gradient(160deg,#dff3ec 0%,#f3faf7 100%)}
:root[data-theme=light][data-tone=lavender]{--brand:#7c3aed;--brand2:#6d28d9;--brandg:linear-gradient(135deg,#a78bfa 0%,#7c3aed 100%);--glow:0 6px 20px rgba(124,58,237,.28);
--bgimg:radial-gradient(1100px 700px at 5% 0%,rgba(196,181,253,.6),transparent 60%),radial-gradient(900px 650px at 95% 10%,rgba(249,168,212,.45),transparent 60%),radial-gradient(1000px 700px at 70% 100%,rgba(165,180,252,.40),transparent 60%),linear-gradient(160deg,#ece6fb 0%,#f8f5fd 100%)}
:root[data-theme=light][data-tone=sunrise]{--brand:#ea580c;--brand2:#c2410c;--brandg:linear-gradient(135deg,#fb923c 0%,#ea580c 100%);--glow:0 6px 20px rgba(234,88,12,.28);
--bgimg:radial-gradient(1100px 700px at 5% 0%,rgba(253,186,116,.55),transparent 60%),radial-gradient(900px 650px at 95% 10%,rgba(252,165,165,.40),transparent 60%),radial-gradient(1000px 700px at 70% 100%,rgba(253,224,71,.35),transparent 60%),linear-gradient(160deg,#fbeee2 0%,#fdf8f3 100%)}
:root[data-theme=light][data-tone=white]{--brand:#4f46e5;--brand2:#4338ca;--brandg:linear-gradient(135deg,#6366f1 0%,#4338ca 100%);--glow:0 4px 14px rgba(79,70,229,.22);
--glass:rgba(255,255,255,.92);--glass2:#f4f6fa;--glass-strong:#fff;--line:#e5e8ef;--line2:#eef0f4;--field:#fff;--shadow:0 1px 3px rgba(16,24,40,.06),0 6px 16px rgba(16,24,40,.05);
--bgimg:linear-gradient(180deg,#f5f7fb 0%,#eef1f6 100%)}
.hidden{display:none!important}
.ico{width:18px;height:18px;flex-shrink:0;display:block}
.glass{background:var(--glass);border:1px solid var(--line);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);box-shadow:var(--shadow)}
/* layout */
.app{display:flex;min-height:100vh;gap:18px;padding:16px}
.side{width:248px;flex-shrink:0;display:flex;flex-direction:column;position:sticky;top:16px;height:calc(100vh - 32px);border-radius:22px;
  background:var(--glass);border:1px solid var(--line);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);box-shadow:var(--shadow)}
.brand{padding:18px 18px 14px;display:flex;gap:12px;align-items:center}
.logo{width:40px;height:40px;border-radius:12px;background:var(--brandg);box-shadow:var(--glow);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:13px;letter-spacing:.5px}
.brand b{display:block;font-size:15px}
.brand small{color:var(--muted);font-size:11.5px}
.navlbl{padding:6px 22px 4px;font-size:10.5px;letter-spacing:1.2px;color:var(--muted);text-transform:uppercase}
.nav{padding:4px 12px;overflow:auto;flex:1}
.nav a{display:flex;gap:11px;align-items:center;padding:10px 12px;border-radius:12px;color:var(--ink);text-decoration:none;margin-bottom:6px;cursor:pointer;
  background:var(--glass);border:1px solid var(--line2);transition:background .15s,transform .15s,box-shadow .15s;font-weight:500}
.nav a:hover{background:var(--glass2);transform:translateX(2px)}
.nav a .ico{opacity:.85}
.nav a.on{background:var(--brandg);color:#fff;border-color:transparent;box-shadow:var(--glow)}
.nav a.on .ico{opacity:1}
.side-foot{padding:12px 14px 14px;border-top:1px solid var(--line2);display:flex;flex-direction:column;gap:10px}
.me{display:flex;gap:10px;align-items:center}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--brandg);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}
.me b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.me small{color:var(--muted);font-size:11.5px}
.footrow{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:var(--muted)}
.main{flex:1;min-width:0;display:flex;flex-direction:column;gap:16px}
.top{border-radius:20px;padding:14px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:16px;z-index:5;
  background:var(--glass);border:1px solid var(--line);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);box-shadow:var(--shadow)}
.ttl{flex:1;min-width:0}
.top h1{font-size:21px;margin:0;font-weight:700;letter-spacing:-.2px}
.top .sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.burger{display:none;background:none;border:0;cursor:pointer;padding:4px}
.iconbtn{width:38px;height:38px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;background:var(--glass);border:1px solid var(--line)}
.iconbtn:hover{background:var(--glass2)}
.content{width:100%;max-width:1500px}
/* ui */
.btn{border:1px solid var(--line);background:var(--glass);color:var(--ink);padding:8px 14px;border-radius:11px;cursor:pointer;font-weight:500;white-space:nowrap;
  display:inline-flex;gap:6px;align-items:center;justify-content:center;backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);transition:background .15s}
.btn:hover{background:var(--glass2)}
.btn.pri{background:var(--brandg);border-color:transparent;color:#fff;box-shadow:var(--glow)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.danger{color:var(--danger);border-color:rgba(248,113,113,.4)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.card{background:var(--glass);border:1px solid var(--line);border-radius:var(--radius);padding:18px;backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);box-shadow:var(--shadow)}
.card h3{margin:0 0 14px;font-size:15.5px;font-weight:650}
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.kpi{background:var(--glass);border:1px solid var(--line);border-radius:var(--radius);padding:16px;backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;inset:0 0 auto 0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent)}
.kh{display:flex;gap:10px;align-items:center}
.kic{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;color:#fff;background:var(--c,#38bdf8);box-shadow:0 6px 18px color-mix(in srgb,var(--c,#38bdf8) 45%,transparent)}
.kpi .l{color:var(--muted);font-size:12.5px;font-weight:500}
.kpi .v{font-size:30px;font-weight:750;margin-top:10px;letter-spacing:-.5px}
.kpi .s{font-size:11.5px;color:var(--muted);margin-top:2px}
.two{grid-template-columns:repeat(auto-fit,minmax(360px,1fr))}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.bar .grow{flex:1}
.in,select.in,textarea.in{border:1px solid var(--line);border-radius:11px;padding:8px 11px;background:var(--field);min-width:0;color:var(--ink);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
.in::placeholder{color:var(--muted)}
.in:focus{outline:2px solid color-mix(in srgb,var(--brand) 45%,transparent);border-color:var(--brand)}
select option{background:var(--opt-bg);color:var(--ink)}
.search{min-width:240px}
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
.tbl{width:100%;border-collapse:collapse}
.tbl th{background:var(--glass2);text-align:left;font-weight:600;font-size:12px;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
.tbl th.sortable{cursor:pointer}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line2);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--glass2)}
.tbl td.num{text-align:right;font-variant-numeric:tabular-nums}
.empty{text-align:center;color:var(--muted);padding:28px!important}
.tbl-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 4px;color:var(--muted);font-size:12px;flex-wrap:wrap}
.pager{display:flex;gap:4px}
.pager button{border:1px solid var(--line);background:var(--glass);border-radius:8px;padding:3px 10px;cursor:pointer}
.pager button.on{background:var(--brandg);color:#fff;border-color:transparent}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap;border:1px solid transparent}
.b-Planning{background:rgba(148,163,184,.18);color:#cbd5e1;border-color:rgba(148,163,184,.3)}
.b-Planned{background:rgba(96,165,250,.18);color:#93c5fd;border-color:rgba(96,165,250,.35)}
.b-InProgress,.b-Late,.b-dup{background:rgba(251,191,36,.16);color:#fcd34d;border-color:rgba(251,191,36,.35)}
.b-Completed,.b-Yes,.b-Present,.b-new{background:rgba(52,211,153,.16);color:#6ee7b7;border-color:rgba(52,211,153,.35)}
.b-NotCompleted,.b-No,.b-Absent,.b-error{background:rgba(248,113,113,.16);color:#fca5a5;border-color:rgba(248,113,113,.35)}
.b-Cancelled,.b-same{background:rgba(148,163,184,.14);color:#94a3b8;border-color:rgba(148,163,184,.25)}
.b-Cancelled{text-decoration:line-through}
.b-Postponed{background:rgba(192,132,252,.18);color:#d8b4fe;border-color:rgba(192,132,252,.35)}
.b-Excused,.b-exists{background:rgba(96,165,250,.16);color:#93c5fd;border-color:rgba(96,165,250,.35)}
:root[data-theme=light] .b-Planning{color:#475569}:root[data-theme=light] .b-Planned,:root[data-theme=light] .b-Excused,:root[data-theme=light] .b-exists{color:#1d4ed8}
:root[data-theme=light] .b-InProgress,:root[data-theme=light] .b-Late,:root[data-theme=light] .b-dup{color:#92400e}
:root[data-theme=light] .b-Completed,:root[data-theme=light] .b-Yes,:root[data-theme=light] .b-Present,:root[data-theme=light] .b-new{color:#047857}
:root[data-theme=light] .b-NotCompleted,:root[data-theme=light] .b-No,:root[data-theme=light] .b-Absent,:root[data-theme=light] .b-error{color:#b91c1c}
:root[data-theme=light] .b-Cancelled,:root[data-theme=light] .b-same{color:#64748b}:root[data-theme=light] .b-Postponed{color:#7e22ce}
.muted{color:var(--muted)}.small{font-size:12px}
.b-meet{background:color-mix(in srgb,#7c3aed 14%,transparent);color:#7c3aed}.b-train{background:color-mix(in srgb,#0891b2 14%,transparent);color:#0e7490}
.warn{color:var(--warn)}.err{color:var(--danger)}.ok-t{color:var(--ok,#16a34a);font-weight:600}
.note{background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.35);border-radius:12px;padding:10px 13px;font-size:13px;margin-bottom:12px}
.note.info{background:rgba(96,165,250,.12);border-color:rgba(96,165,250,.35)}
/* forms */
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px 14px}
.fld label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:500}
.fld .in{width:100%}
.fld.wide{grid-column:1/-1}
.req::after{content:" *";color:var(--danger)}
.chk{display:flex;align-items:center;gap:6px;font-size:13px}
/* modal */
.ov{position:fixed;inset:0;background:rgba(3,7,18,.5);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:flex-start;justify-content:center;z-index:50;padding:30px 12px;overflow:auto}
.modal{background:var(--glass-strong);border:1px solid var(--line);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border-radius:20px;width:100%;max-width:880px;box-shadow:0 30px 80px rgba(0,0,0,.45)}
.modal.sm{max-width:440px}.modal.lg{max-width:1100px}
.mh{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line2)}
.mh h2{margin:0;font-size:16.5px;flex:1}
.mh .x{background:none;border:0;font-size:24px;cursor:pointer;color:var(--muted)}
.mb{padding:20px;max-height:calc(100vh - 200px);overflow:auto}
.mf{padding:12px 20px;border-top:1px solid var(--line2);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.dl{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px 18px;margin-bottom:14px}
.dl>div>span:first-child{display:block;font-size:11px;color:var(--muted);margin-bottom:2px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line2);margin-bottom:14px;flex-wrap:wrap}
.tabs button{border:0;background:none;padding:8px 12px;cursor:pointer;border-bottom:2px solid transparent;color:var(--muted);font-weight:500}
.tabs button{display:inline-flex;align-items:center;gap:6px}.tabs button.on{border-color:var(--brand);color:var(--brand)}
/* toast/loading */
#toast{position:fixed;right:16px;bottom:16px;z-index:90;display:flex;flex-direction:column;gap:8px}
.t{background:var(--glass-strong);border:1px solid var(--line);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);color:var(--ink);padding:11px 15px;border-radius:12px;max-width:360px;box-shadow:var(--shadow);font-size:13px}
.t.ok{border-left:4px solid var(--ok)}.t.bad{border-left:4px solid var(--danger)}
#loading{position:fixed;inset:0;background:rgba(3,7,18,.25);z-index:80;display:flex;align-items:center;justify-content:center}
.spin{width:40px;height:40px;border:4px solid rgba(255,255,255,.2);border-top-color:var(--brand);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
/* login */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.login .box{background:var(--glass);border:1px solid var(--line);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border-radius:24px;padding:30px;width:100%;max-width:400px;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.login h2{margin:14px 0 4px}.login p{margin:0 0 18px;color:var(--muted);font-size:13px}
.login .fld{margin-bottom:12px}
.langsw{display:flex;gap:4px}
.langsw button{border:1px solid var(--line);background:var(--glass);border-radius:8px;padding:3px 9px;cursor:pointer;font-size:12px}
.langsw button.on{background:var(--brandg);color:#fff;border-color:transparent}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line2);border-left:1px solid var(--line2);background:var(--glass);border-radius:var(--radius);overflow:hidden;backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--line)}
.cal .h{background:var(--glass2);font-size:12px;font-weight:600;padding:8px 2px;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.cal .d{min-height:110px;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);padding:5px;font-size:12px}
.cal .d.out{opacity:.4}
.cal .d.today .n{background:var(--brandg);color:#fff;border-radius:50%;width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;box-shadow:var(--glow)}
.cal .n{font-weight:600;margin-bottom:3px}
.ev{display:block;border-radius:7px;padding:3px 6px;margin-top:3px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11.5px;border-left:3px solid}
.week .d{min-height:230px}
.yeargrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.ymon{padding:12px 14px}
.ymh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;cursor:pointer;padding:4px 6px;border-radius:9px}
.ymh:hover{background:var(--glass2)}
.ygrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;font-size:12px}
.ygrid .yh{color:var(--muted);font-size:10.5px;padding:2px 0;overflow:hidden;white-space:nowrap}
.ygrid .yd{padding:4px 0;border-radius:7px;cursor:pointer;font-variant-numeric:tabular-nums}
.ygrid .yd:hover{background:var(--glass2)}
.ygrid .yd.out{opacity:.25;cursor:default}
.ygrid .yd.has{background:color-mix(in srgb,var(--brand) 18%,transparent);color:var(--brand);font-weight:700}
.ygrid .yd.today{outline:2px solid var(--brand);outline-offset:-2px}
.daylist .ev{white-space:normal;font-size:13px;padding:9px 11px;margin-bottom:7px}
.picklist{max-height:380px;overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--glass)}
.picklist label{display:flex;gap:8px;padding:8px 11px;border-bottom:1px solid var(--line2);cursor:pointer;align-items:center}
.picklist label:hover{background:var(--glass2)}
.picklist label.dis{opacity:.5;cursor:default}
.steps{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.steps span{padding:5px 13px;border-radius:999px;background:var(--glass2);font-size:12px;color:var(--muted);border:1px solid var(--line2)}

/* ================= server ================= */
/* Server connection: inside Google Apps Script -> google.script.run;
   page hosted elsewhere (GitHub Pages) -> POST to the Apps Script Web App URL set in config.js (window.KGS_API_URL). */
const hasGas=()=>!!(window.google&&google.script&&google.script.run);
const okUrl=u=>{u=String(u||'').trim();return /^https:\/\/script\.google(usercontent)?\.com\/.+\/exec$/.test(u)||isSB(u)?u:'';};
const isSB=u=>/^https:\/\/[a-z0-9]+\.supabase\.co\/functions\/v1\/[\w-]+$/.test(String(u||'').trim());
const sbMode=()=>!hasGas()&&isSB(apiUrl());
/* one POST for both back ends: Apps Script = text/plain (no pre-flight); Supabase = JSON + apikey */
function apiPost(u,body){return fetch(u,isSB(u)?{method:'POST',headers:{'Content-Type':'application/json','apikey':window.KGS_SB_KEY||''},body:JSON.stringify(body)}
  :{method:'POST',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});}
const urlOverride=()=>{try{return okUrl(localStorage.getItem('kgs_api_url'));}catch(e){return '';}};
const apiUrl=()=>urlOverride()||okUrl(window.KGS_API_URL);
/* test a Web App URL: POST 'status' and expect this app's answer */
function testApiUrl(u){u=okUrl(u);if(!u)return Promise.reject({message:t('cn_badUrl')});
  return apiPost(u,{action:'status',token:'',payload:{}})
   .then(r=>{if(!r.ok)throw {message:'HTTP '+r.status};return r.json();},()=>{throw {message:t('cn_noReach')};})
   .then(r=>{if(!r||!r.ok||!r.data||!r.data.version)throw {message:t('cn_notApp')};return r.data;},e=>{throw (e&&e.message)?e:{message:t('cn_notApp')};});}
function saveApiUrl(u){try{if(u&&u!==okUrl(window.KGS_API_URL))localStorage.setItem('kgs_api_url',u);else localStorage.removeItem('kgs_api_url');}catch(e){}}
const apiMode=()=>!hasGas()&&!!apiUrl();
function transport(action,payload){
  if(hasGas())return new Promise((res,rej)=>google.script.run.withSuccessHandler(res).withFailureHandler(e=>rej({message:e&&e.message?e.message:String(e)})).api(action,S.token,payload||{}));
  if(apiUrl())return apiPost(apiUrl(),{action,token:S.token||'',payload:payload||{}})
    .then(r=>{if(!r.ok)throw {message:'HTTP '+r.status};return r.json();})
    .catch(e=>{throw {error:e&&e.error||'NET',message:(e&&e.message&&!/fetch|network/i.test(e.message))?e.message:t('netErr')};});
  return Promise.reject({message:t('notConfigured')});
}
function call(action,payload,opt){
  opt=opt||{};
  if(!opt.silent)loading(true);
  return transport(action,payload).then(r=>{if(!opt.silent)loading(false);
      if(!r)throw {message:'No response'};
      if(r.ok)return r.data;
      if(r.error==='AUTH'){toast(t('sessionExpired'),'bad');doLogoutLocal();}
      else if(r.error==='MUST_CHANGE'){renderForceChange();}
      throw r;},
    e=>{if(!opt.silent)loading(false);throw e;});
}

function ac(){if(!SND.ctx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;const c=SND.ctx=new C();const m=c.createGain();m.connect(c.destination);const L=c.sampleRate*1.4,ir=c.createBuffer(2,L,c.sampleRate);for(let h=0;h<2;h++){const d=ir.getChannelData(h);for(let i=0;i<L;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/L,3.2);}const cv=c.createConvolver();cv.buffer=ir;const w=c.createGain();w.gain.value=.18;cv.connect(w).connect(m);SND.out=m;SND.rev=cv;}if(SND.ctx.state==='suspended')SND.ctx.resume();return SND.ctx;}

function mount(){if(R)return;const h=document.createElement('div');h.id='kfxHost';document.body.appendChild(h);R=h.attachShadow({mode:'open'});

/* job({title, steps:[..], icon:'backup|restore|excel|import|sync|update', run:async step=>message}) -> resolves true after the user confirms, false if it failed and was closed */
async function job(o){

  const step=i=>{cur=Math.max(cur,Math.min(n-1,i));};

function dataTable(id,cols,rows,opt){
  opt=opt||{};
  const st=S.tbl[id]||(S.tbl[id]={p:1,k:opt.sortK||null,d:opt.sortD||1});
  let r=rows.slice();
  if(st.k){const c=cols.find(c=>c.k===st.k);const f=c&&c.sv?c.sv:(x=>x[st.k]);
    r.sort((a,b)=>{const A=f(a),B=f(b);return (typeof A==='number'&&typeof B==='number'?A-B:String(A??'').localeCompare(String(B??''),undefined,{numeric:true}))*st.d;});}
  const ps=opt.ps||25,pages=Math.max(1,Math.ceil(r.length/ps));if(st.p>pages)st.p=pages;
  const sl=opt.noPage?r:r.slice((st.p-1)*ps,st.p*ps);
  let h=`<div class="tbl-wrap"><table class="tbl"><thead><tr>${cols.map(c=>`<th ${c.k&&c.sort!==false?`class="sortable" data-tsort="${id}|${c.k}"`:''}>${c.h!==undefined?c.h:esc(c.l)}${st.k===c.k&&c.k?(st.d>0?' ▲':' ▼'):''}</th>`).join('')}</tr></thead><tbody>`;
  h+=sl.length?sl.map(x=>`<tr ${opt.rowAttr?opt.rowAttr(x):''}>${cols.map(c=>`<td class="${c.cls||''}">${c.r?c.r(x):esc(x[c.k]??'')}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${cols.length}" class="empty">${t('noData')}</td></tr>`;
  h+='</tbody></table></div>';
  let pg='';
  if(!opt.noPage&&pages>1){const P=[];for(let i=1;i<=pages;i++){if(i===1||i===pages||Math.abs(i-st.p)<=2)P.push(i);else if(P[P.length-1]!=='…')P.push('…');}
    pg=`<div class="pager no-print">${P.map(i=>i==='…'?'<span>…</span>':`<button class="${i===st.p?'on':''}" data-tpage="${id}|${i}">${i}</button>`).join('')}</div>`;}
  h+=`<div class="tbl-foot"><span>${t('showing')} ${r.length?((opt.noPage?1:(st.p-1)*ps+1)+'–'+(opt.noPage?r.length:Math.min(st.p*ps,r.length))):0} ${t('of')} ${r.length}</span>${pg}</div>`;
  return h;
}

   on time / late / absent / not recorded; training / meeting; employment and activity status). Needs xlsx-js-style. */
const XS=(()=>{const F='Times New Roman',FL='Phetsarath OT',LAO=/[\u0E80-\u0EFF]/,bd={style:'thin',color:{rgb:'DCE3EE'}},B={top:bd,bottom:bd,left:bd,right:bd};

  const V={};const put=(arr,p)=>arr.forEach(v=>{V[String(v).toUpperCase()]=p;});
  put(['Present','ມາ','Completed','ACTIVE','Yes','Approved','Passed','ຜ່ານ','Valid','ຍັງໃຊ້ໄດ້'],'good');put(['Late','ມາຊ້າ','PROBATION','Planned','Scheduled','In Progress','Ongoing','Pending'],'mid');
  put(['Absent','ຂາດ','Cancelled','RESIGNED','TERMINATED','CONTRACT END','RETIRED','No','Failed','ບໍ່ຜ່ານ','Expired','ໝົດອາຍຸແລ້ວ'],'bad');put(['Training','ຝຶກອົບຮົມ'],'tr');put(['Meeting','ປະຊຸມ'],'mt');
  const rateP=v=>v==null||v===''?null:(v>=0.9?'good':v>=0.75?'mid':'bad');
  const font=o=>Object.assign({name:F,sz:10,color:{rgb:'1F2937'}},o||{});
  const len=v=>(v==null?'':String(v)).length;
  /* Lao text in Phetsarath OT, English and numbers in Times New Roman (one font per cell, chosen by its text) */
  const fonts=ws=>{Object.keys(ws).forEach(k=>{if(k[0]==='!')return;const c=ws[k];if(c&&c.s&&c.s.font)c.s.font=Object.assign({},c.s.font,{name:LAO.test(String(c.v==null?'':c.v))?FL:F});});return ws;};
  /* o.hr = number of banner rows above the header (row 0 title, row 1 subtitle, row hr-1 spacer) */
  function table(ws,o){o=o||{};if(!ws['!ref'])return ws;const r=XLSX.utils.decode_range(ws['!ref']),h=o.hr||0,last=r.e.r;const W=[];
    for(let R0=r.s.r;R0<=last;R0++)for(let C=r.s.c;C<=r.e.c;C++){const a=XLSX.utils.encode_cell({r:R0,c:C});let c=ws[a];if(!c){c=ws[a]={t:'s',v:''};}
      if(R0<h){c.s={font:font(R0===0?{sz:16,bold:true,color:{rgb:'1E3A8A'}}:{sz:10,color:{rgb:'64748B'}}),alignment:{vertical:'center'}};continue;}
      W[C]=Math.max(W[C]||0,R0===h?Math.min(len(c.v),16):len(c.z==='0.0%'?'100.0%':c.v));
      if(R0===h){c.s={font:font({sz:10,bold:true,color:{rgb:'FFFFFF'}}),fill:{patternType:'solid',fgColor:{rgb:'1E3A8A'}},alignment:{vertical:'center',horizontal:'center',wrapText:true},border:{top:{style:'thin',color:{rgb:'1E3A8A'}},bottom:{style:'medium',color:{rgb:'F59E0B'}},left:{style:'thin',color:{rgb:'3B5BA9'}},right:{style:'thin',color:{rgb:'3B5BA9'}}}};continue;}
      const isTot=o.total&&R0===last,kind=(o.sem||[])[C],num=typeof c.v==='number';
      const s={font:font(),border:B,fill:{patternType:'solid',fgColor:{rgb:isTot?'E8EEFC':((R0-h)%2?'FFFFFF':'F6F8FC')}},alignment:{vertical:'center',horizontal:num?'center':'left',indent:num?0:1}};
      let p=null;if(kind==='rate')p=rateP(c.v);else if(c.t==='s'&&c.v!==''&&V[String(c.v).trim().toUpperCase()])p=V[String(c.v).trim().toUpperCase()];
      if(p){s.fill={patternType:'solid',fgColor:{rgb:pal[p][0]}};s.font=font({bold:true,color:{rgb:pal[p][1]}});s.alignment={vertical:'center',horizontal:'center'};}
      else if(num&&c.v===0&&kind!=='rate'){s.font=font({color:{rgb:'B6C0CF'}});c.z='#,##0;-#,##0;"–"';}
      else if(num&&kind){const col={on:'15803D',late:'B45309',ab:'B91C1C',nm:'64748B'}[kind];if(col)s.font=font({bold:true,color:{rgb:col}});}
      else if(num&&!c.z)c.z=Number.isInteger(c.v)?'#,##0':'#,##0.0';
      if(C===r.s.c&&!num&&!p)s.font=font({bold:!!o.firstBold,color:{rgb:'0F172A'}});
      if(isTot){s.font=Object.assign({},s.font,{bold:true,color:{rgb:(s.font.color&&s.font.color.rgb)==='B6C0CF'?'94A3B8':((s.font.color&&s.font.color.rgb)||'1E3A8A')}});s.border=Object.assign({},B,{top:{style:'medium',color:{rgb:'1E3A8A'}},bottom:{style:'medium',color:{rgb:'1E3A8A'}}});}
      c.s=s;}
    if(!o.keepCols)ws['!cols']=W.map((w,i)=>({wch:Math.max(i===r.s.c?12:9,Math.min(44,Math.ceil((w||6)*1.15)+3))}));
    const rows=[];for(let i=0;i<=last;i++)rows[i]={hpt:i<h?(i===0?28:18):(i===h?36:21)};if(h>1)rows[h-1]={hpt:8};ws['!rows']=rows;
    if(last>h)ws['!autofilter']={ref:XLSX.utils.encode_range({s:{r:h,c:r.s.c},e:{r:last-(o.total?1:0),c:r.e.c}})};
    ws['!kfreeze']=h+1;return fonts(ws);}
  function kv(ws,rateRows){if(!ws['!ref'])return ws;const r=XLSX.utils.decode_range(ws['!ref']);const rows=[];
    for(let R0=0;R0<=r.e.r;R0++){rows[R0]={hpt:R0===0?30:22};for(let C=0;C<=r.e.c;C++){const a=XLSX.utils.encode_cell({r:R0,c:C});const c=ws[a];if(!c)continue;
      if(R0===0){c.s={font:font({sz:16,bold:true,color:{rgb:'1E3A8A'}}),alignment:{vertical:'center'}};continue;}
      if(c.v===''){continue;}
      const num=typeof c.v==='number';
      const s={font:font({sz:10.5,bold:C===0,color:{rgb:C===0?'334155':'0F172A'}}),border:B,fill:{patternType:'solid',fgColor:{rgb:C===0?'EEF2FF':'FFFFFF'}},alignment:{vertical:'center',horizontal:num?'center':'left',indent:num?0:1}};
      if(C>0&&(rateRows||[]).includes(R0)&&num){const p=c.v>=90?'good':c.v>=75?'mid':'bad';s.fill={patternType:'solid',fgColor:{rgb:pal[p][0]}};s.font=font({sz:11,bold:true,color:{rgb:pal[p][1]}});}
      else if(C>0&&num)s.font=font({sz:11,bold:true,color:{rgb:'1E3A8A'}});
      c.s=s;}}ws['!rows']=rows;return fonts(ws);}
  return{table,kv,F,fonts};})();

/* ===== full backup file (.kgsbak): AES-256-GCM encrypted JSON, password chosen by the admin ===== */
const u8b64=u=>{let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s);};
const b64u8=b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0));
async function bkKey(pw,salt){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:200000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);}
async function bkSeal(obj,pw){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},await bkKey(pw,salt),new TextEncoder().encode(JSON.stringify(obj))));
  const counts={};Object.keys(obj.tables).forEach(n=>counts[n]=obj.tables[n].length);
  return JSON.stringify({kgsBackup:1,app:obj.app,createdAt:obj.createdAt,createdBy:obj.createdBy,counts,enc:'AES-256-GCM/PBKDF2-SHA256-200000',salt:u8b64(salt),iv:u8b64(iv),data:u8b64(ct)});}
async function bkOpen(file,pw){const o=JSON.parse(file);
  try{const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64u8(o.iv)},await bkKey(pw,b64u8(o.salt)),b64u8(o.data));return JSON.parse(new TextDecoder().decode(pt));}
  catch(e){throw {message:t('bk_badPw')};}}

   ${k(t('totalEmployees'),fmtN(emps),t('activeOnly'))}${k(t('totalActivities'),fmtN(acts.length),t('cat_training')+' '+acts.filter(a=>actCat(a)==='training').length+' · '+t('cat_meeting')+' '+acts.filter(a=>actCat(a)==='meeting').length)}${k(t('planned'),cnt(['Planning','Planned']),t('kpiPlannedNote'))}
   ${k(t('inProgress'),cnt(['In Progress']))}${k(t('completed'),cnt(['Completed']))}${k(t('cancelled'),cnt(['Cancelled']))}
   ${k(t('totalParticipants'),fmtN(parts.length))}${k(t('attendanceRate'),pr+ab?Math.round(pr*100/(pr+ab))+'%':'—',t('kpiRateNote'))}
   ${k(t('trainingHours'),fmtN(comp.reduce((s,a)=>s+num(a.DurationHours),0),1),t('kpiHoursNote'))}${k(t('trainingDays'),fmtN(comp.reduce((s,a)=>s+num(a.DurationDays),0),1),t('kpiHoursNote'))}
   </div>

// square crop around the centre, 240 px, JPEG; quality/size lowered until it fits 28 000 characters
function photoFromFile(f){return new Promise((res,rej)=>{
  if(!/^image\/(jpeg|png|webp)$/.test(f.type))return rej(new Error(t('ph_type')));
  if(f.size>15*1024*1024)return rej(new Error(t('ph_big')));
  const fr=new FileReader();fr.onerror=()=>rej(new Error(t('ph_type')));
  fr.onload=()=>{const img=new Image();
    img.onload=()=>{try{const w=img.naturalWidth,h=img.naturalHeight,sq=Math.min(w,h);if(!sq)return rej(new Error(t('ph_type')));
      for(const size of [240,200,160,120]){const c=document.createElement('canvas');c.width=c.height=size;const x=c.getContext('2d');
        x.fillStyle='#fff';x.fillRect(0,0,size,size);x.drawImage(img,(w-sq)/2,(h-sq)/2,sq,sq,0,0,size,size);
        for(const q of [0.85,0.75,0.65,0.55]){const u=c.toDataURL('image/jpeg',q);if(u.length<=28000)return res(u);}}
      rej(new Error(t('ph_big')));}catch(e){rej(new Error(t('ph_type')));}};
    img.onerror=()=>rej(new Error(t('ph_type')));img.src=fr.result;};
  fr.readAsDataURL(f);});}

const MONTHS={en:['January','February','March','April','May','June','July','August','September','October','November','December'],lo:['ມັງກອນ','ກຸມພາ','ມີນາ','ເມສາ','ພຶດສະພາ','ມິຖຸນາ','ກໍລະກົດ','ສິງຫາ','ກັນຍາ','ຕຸລາ','ພະຈິກ','ທັນວາ']};
const monthName=d=>MONTHS[S.lang==='lo'?'lo':'en'][d.getMonth()];
function pageCalendar(){
  const c=S.cal;if(!c.date)c.date=todayStr();
  const cy=parseD(c.date).getFullYear(),cm=parseD(c.date).getMonth();
  const yrs=[...new Set([...S.acts.map(a=>Number(String(a.StartDate).slice(0,4))).filter(y=>y>2000),new Date().getFullYear()-1,new Date().getFullYear(),new Date().getFullYear()+1,cy])].sort((a,b)=>a-b);
  const mNames=MONTHS[S.lang==='lo'?'lo':'en'];
  $('#page').innerHTML=`<div class="bar no-print"><button class="btn sm" data-act="calNav" data-arg="-1" title="${t('prev')}">‹</button><button class="btn sm" data-act="calNav" data-arg="0">${t('today')}</button><button class="btn sm" data-act="calNav" data-arg="1" title="${t('next')}">›</button>
   <select class="in" id="calY" title="${t('year')}" style="font-weight:600">${yrs.map(y=>`<option value="${y}" ${y===cy?'selected':''}>${y}</option>`).join('')}</select>
   <select class="in" id="calM" title="${t('month')}" ${c.view==='year'?'disabled':''}>${mNames.map((m,i)=>`<option value="${i}" ${i===cm?'selected':''}>${m}</option>`).join('')}</select>
   <input type="date" class="in" id="calD" value="${c.date}" title="${t('goDate')}">
   <b id="calTitle" style="margin-left:4px;font-size:15px"></b><span class="grow"></span>
   <div class="tabs" style="margin:0;border:0">${['year','month','week','day'].map(v=>`<button class="${c.view===v?'on':''}" data-act="calView" data-arg="${v}">${t(v)}</button>`).join('')}</div></div><div id="calBody"></div>`;
  const clampDay=(y,m)=>{const last=new Date(y,m+1,0).getDate();return ymd(new Date(y,m,Math.min(parseD(c.date).getDate(),last)));};
  $('#calY').onchange=()=>{c.date=clampDay(Number($('#calY').value),c.view==='year'?0:parseD(c.date).getMonth());if(c.view==='year')c.date=$('#calY').value+'-01-01';pageCalendar();};
  $('#calM').onchange=()=>{c.date=clampDay(parseD(c.date).getFullYear(),Number($('#calM').value));if(c.view!=='week'&&c.view!=='day')c.view='month';pageCalendar();};
  $('#calD').onchange=()=>{if(!$('#calD').value)return;c.date=$('#calD').value;c.view='day';pageCalendar();};
  const evOn=d=>S.acts.filter(a=>a.StartDate&&a.StartDate<=d&&(a.EndDate||a.StartDate)>=d).sort((x,y)=>(x.StartTime||'').localeCompare(y.StartTime||''));
  const ev=a=>`<span class="ev" style="border-color:${STATUS_COLOR[a.Status]||'#999'};background:${STATUS_COLOR[a.Status]||'#999'}1a" data-act="viewAct" data-arg="${esc(a.ActivityID)}" title="${esc(a.Title)}">${a.StartTime?esc(a.StartTime)+' ':''}${esc(a.Title)}</span>`;
  const dn=S.lang==='lo'?['ຈັນ','ອັງຄານ','ພຸດ','ພະຫັດ','ສຸກ','ເສົາ','ອາທິດ']:['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const d0=parseD(c.date),today=todayStr();
  const monStart=s=>{const d=parseD(s);const w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return ymd(d);};
  if(c.view==='year'){
    const y=d0.getFullYear();$('#calTitle').textContent=t('year')+' '+y+' · '+S.acts.filter(a=>String(a.StartDate).slice(0,4)===String(y)).length+' '+t('activity').toLowerCase();
    let html='';
    for(let m=0;m<12;m++){
      const first=ymd(new Date(y,m,1)),mm=first.slice(0,7);
      const inM=S.acts.filter(a=>a.StartDate&&a.StartDate.slice(0,7)<=mm&&(a.EndDate||a.StartDate).slice(0,7)>=mm);
      let g=dn.map(x=>`<span class="yh">${esc(x.slice(0,S.lang==='lo'?2:1))}</span>`).join('');let cur=monStart(first);
      for(let i=0;i<42;i++){const d=parseD(cur);if(i>=35&&d.getMonth()!==m)break;const out=d.getMonth()!==m,n=out?0:evOn(cur).length;
        g+=`<span class="yd${out?' out':''}${cur===today?' today':''}${n?' has':''}" ${out?'':`data-act="calDay" data-arg="${cur}"`} title="${n?n+' '+esc(t('activity')):''}">${d.getDate()}</span>`;cur=addDays(cur,1);}
      html+=`<div class="ymon card"><div class="ymh" data-act="calMonth" data-arg="${first}"><b>${esc(mNames[m])}</b><span class="badge ${inM.length?'b-Planned':'b-same'}">${inM.length}</span></div><div class="ygrid">${g}</div></div>`;
    }
    $('#calBody').innerHTML=`<div class="yeargrid">${html}</div>`;
  }else if(c.view==='month'){
    $('#calTitle').textContent=monthName(d0)+' '+d0.getFullYear();
    const first=ymd(new Date(d0.getFullYear(),d0.getMonth(),1));let cur=monStart(first);let h=dn.map(x=>`<div class="h">${x}</div>`).join('');
    for(let i=0;i<42;i++){const d=parseD(cur);if(i>=35&&d.getMonth()!==d0.getMonth())break;
      h+=`<div class="d ${d.getMonth()!==d0.getMonth()?'out':''} ${cur===today?'today':''}"><div class="n" data-act="calDay" data-arg="${cur}" style="cursor:pointer">${d.getDate()}</div>${evOn(cur).map(ev).join('')}</div>`;cur=addDays(cur,1);}
    $('#calBody').innerHTML=`<div class="cal">${h}</div>`;
  }else if(c.view==='week'){
    const s=monStart(c.date);$('#calTitle').textContent=fmtD(s)+' – '+fmtD(addDays(s,6));
    let h='';for(let i=0;i<7;i++){const d=addDays(s,i);h+=`<div class="h">${dn[i]} ${parseD(d).getDate()}</div>`;}
    for(let i=0;i<7;i++){const d=addDays(s,i);h+=`<div class="d ${d===today?'today':''}">${evOn(d).map(ev).join('')}</div>`;}
    $('#calBody').innerHTML=`<div class="cal week">${h}</div>`;
  }else{
    $('#calTitle').textContent=dn[(d0.getDay()+6)%7]+' '+d0.getDate()+' '+monthName(d0)+' '+d0.getFullYear();
    const list=evOn(c.date);
    $('#calBody').innerHTML=`<div class="card daylist">${list.length?list.map(a=>`<span class="ev" style="border-color:${STATUS_COLOR[a.Status]};background:${STATUS_COLOR[a.Status]}14" data-act="viewAct" data-arg="${esc(a.ActivityID)}"><b>${esc(a.StartTime||'')}${a.EndTime?'–'+esc(a.EndTime):''}</b> ${esc(a.Title)}<br><span class="small muted">${esc(tv(a.Type))} · ${esc(tv(a.Location))} · ${esc(tv(a.Status))} · ${(S.partsByAct[a.ActivityID]||[]).length} ${t('participants')}</span></span>`).join(''):`<p class="muted">${t('noData')}</p>`}</div>`;
  }
}

function hvData(src){
  const f=src?src.f:S.f.hist;const ranged=!!(f.from||f.to),Y=Number(f.xy)||new Date().getFullYear();
  /* no date filter -> the whole analysis is for one calendar year (Jan–Dec), chosen with ‹ year › */

function xlSummaries(D){

    return{inv,inn:on+late,on,late,ab,nm,rate:P(on+late,on+late+ab),hrs:Math.round(rows.filter(r=>went(r)&&r.Cat==='training').reduce((a,r)=>a+num(r.DurationHours),0)*10)/10,
      tr:new Set(rows.filter(r=>r.Cat==='training').map(r=>r.ActivityID)).size,mt:new Set(rows.filter(r=>r.Cat==='meeting').map(r=>r.ActivityID)).size,ppl:new Set(rows.filter(went).map(r=>r.EmployeeID)).size};};

  const by=(keyFn)=>{const g={};D.R.forEach(r=>{const k=keyFn(r)||'—';(g[k]=g[k]||[]).push(r);});return g;};
  const ML=MONTHS[S.lang==='lo'?'lo':'en'];
  /* month table always shows a full calendar year (Jan–Dec, empty months = 0), or every month of the chosen date range */
  const gm=by(r=>String(r.StartDate).slice(0,7));const fr=S.f.rep||{};let months=[];
  if(fr.from&&fr.to){let d=parseD(fr.from);d.setDate(1);const end=parseD(fr.to);while(d<=end&&months.length<60){months.push(d.getFullYear()+'-'+pad(d.getMonth()+1));d.setMonth(d.getMonth()+1);}}

  const E=histByEmp(D.R,D.X).sort((a,b)=>String(a.EmployeeID).localeCompare(String(b.EmployeeID))).map(e=>{const rr=D.R.filter(r=>r.EmployeeID===e.EmployeeID);return{_k:e.EmployeeID,_n:e.NameLA||e.Name,_dv:e.Division,...agg(rr),ex:e.ex||0,xh:e.xh||0,last:fmtD(e.last)};});
  const tot=agg(D.R);
  return [
   {key:'m',title:t('xl_month'),cols:[C('_k',t('xl_monthCol'),'s'),...base],rows:mRows,total:mTot},
   {key:'d',title:t('xl_dept'),cols:[C('_k',fl('Division'),'s'),C('tr',t('cat_training'),'n'),C('mt',t('cat_meeting'),'n'),...base.slice(2)],rows:dRows,total:tot},
   {key:'t',title:t('xl_type'),cols:[C('_k',fl('Type'),'s'),...base],rows:tRows,total:tot},
   {key:'a',title:t('hv_byAct'),cols:[C('_d',fl('StartDate'),'s'),C('_k',fl('Title'),'s'),C('_c',t('cat_label'),'s'),...base.slice(2)],rows:A,total:tot},
   {key:'e',title:t('hv_byEmp'),cols:[C('_k',fl('EmployeeID'),'s'),C('_n',fl('Name'),'s'),C('_dv',fl('Division'),'s'),C('tr',t('cat_training'),'n'),C('mt',t('cat_meeting'),'n'),C('ex',LX('ຝຶກພາຍນອກ','External'),'n'),C('inv',t('hv_invited'),'n'),C('on',t('ci_onTime'),'n'),C('late',t('late'),'n'),C('ab',t('absent'),'n'),C('rate',t('hv_rate'),'p'),C('hrs',t('es_hours'),'n'),C('xh',LX('ຊົ່ວໂມງຝຶກພາຍນອກ','External hours'),'n'),C('last',t('hv_last'),'s')],rows:E,total:{...tot,ex:D.xN||0,xh:D.xHrs||0}}];

   steps:[LX('ດຶງຂໍ້ມູນທຸກຕາຕະລາງ','Reading every table'),LX('ຄິດໄລ່ບົດສະຫຼຸບ','Calculating summaries'),LX('ສ້າງໄຟລ໌ Excel','Building the Excel file')],
   onOk:()=>{if(S.page==='admin')admData();},
   run:async step=>{step(0);const d=await call('backup.export',null,{silent:true});step(1);await new Promise(r=>setTimeout(r,60));
    const wb=XLSX.utils.book_new(),toc=[];
    const cut=v=>{v=v??'';return typeof v==='string'&&v.length>32000?v.slice(0,32000):v;};
    const add=(name,head,rows)=>{const ws=XLSX.utils.aoa_to_sheet([head,...rows]);ws['!cols']=head.map(h=>({wch:Math.min(40,Math.max(10,String(h).length+2))}));
      XS.table(ws,{firstBold:true});
      const nm=name.replace(/[\\/?*\[\]:]/g,' ').slice(0,31);XLSX.utils.book_append_sheet(wb,ws,nm);toc.push([nm,rows.length]);};
    const T=d.tables,H=d.heads,raw=(n,skip)=>{const h=(H[n]||[]).filter(c=>(skip||[]).indexOf(c)<0);return{h,rows:(T[n]||[]).map(r=>h.map(c=>cut(r[c])))};};
    const eh=(H.Employees||[]).filter(c=>c!=='RawData'),emps=T.Employees||[];
    add(t('xa_cur'),eh,emps.filter(e=>isCurrent(e)).map(e=>eh.map(c=>cut(e[c]))));
    add(t('xa_former'),eh,emps.filter(e=>!isCurrent(e)).map(e=>eh.map(c=>cut(e[c]))));
    {const h=H.Activities||[];add(t('nav_activities'),[...h,t('xa_cat')],(T.Activities||[]).map(a=>[...h.map(c=>cut(a[c])),actCat(a)==='meeting'?t('cat_meeting'):t('cat_training')]));}
    {const E={},A={};emps.forEach(e=>E[e.EmployeeID]=e);(T.Activities||[]).forEach(a=>A[a.ActivityID]=a);const ph=H.Participants||[];
      const lead=['EmployeeID','NameEN','NameLA','Division','ActivityID','Title','Type',t('xa_cat'),'StartDate','EndDate','DurationHours'];
      add(t('participants'),[...lead,...ph.filter(c=>c!=='EmployeeID'&&c!=='ActivityID')],(T.Participants||[]).map(p=>{const e=E[p.EmployeeID]||{},a=A[p.ActivityID]||{};
        return[p.EmployeeID,e.NameEN||'',e.NameLA||'',e.Division||'',p.ActivityID,a.Title||'',a.Type||'',a.ActivityID?(actCat(a)==='meeting'?t('cat_meeting'):t('cat_training')):'',a.StartDate||'',a.EndDate||'',a.DurationHours||'',...ph.filter(c=>c!=='EmployeeID'&&c!=='ActivityID').map(c=>cut(p[c]))];}));}
    {const E={};emps.forEach(e=>E[e.EmployeeID]=e);const xh=H.ExtTraining||[];if(xh.length)add(LX('ຝຶກພາຍນອກ & ໃບຢັ້ງຢືນ','External training'),['EmployeeID','NameLA','NameEN','Division',...xh.filter(c=>c!=='EmployeeID')],(T.ExtTraining||[]).map(r=>{const e=E[r.EmployeeID]||{};return[r.EmployeeID,e.NameLA||'',e.NameEN||'',e.Division||'',...xh.filter(c=>c!=='EmployeeID').map(c=>cut(r[c]))];}));}
    const f=S.f.rep||{};const D=hvData({f:{from:'',to:'',div:'',xy:f.xy},rows:historyRows()});
    xlAppendSummaries(wb,D).forEach(x=>toc.push(x));const dash=xlDash(wb,D,xlSummaries(D));toc.push([dash.sheet,4+' '+LX('ກາບ','charts')]);step(2);
    {const r=raw('Users');add(t('users'),r.h,r.rows);}
    {const r=raw('Settings');add(t('nav_settings'),r.h,r.rows);}
    {const r=raw('AuditLog');add(t('auditLog'),r.h,r.rows);}
    {const r=raw('DuplicateReview',['RawData']);add(t('xa_dup'),r.h,r.rows);}
    const head=[[t('xa_title')],[companyName()],[t('xl_made'),fmtD(todayStr())+' '+new Date().toTimeString().slice(0,5)+' · '+(S.me?S.me.FullName||S.me.Username:'')],[t('version'),(S.version||'')+' · UI 11-11b'],[],
      [t('xa_sheet'),t('xa_rows')],...toc,[],[t('xa_note1')],[t('xa_note2')],[t('xa_note3')]];
    const ws=XLSX.utils.aoa_to_sheet(head);ws['!cols']=[{wch:44},{wch:30}];XS.kv(ws);XLSX.utils.book_append_sheet(wb,ws,t('xa_toc').slice(0,31));
    wb.SheetNames.unshift(wb.SheetNames.pop());
    await xlWriteWithCharts(wb,fn,dash);if(d.settings)S.settings=d.settings;
    return fn+' · '+toc.length+' '+LX('ແຜ່ນ','sheets');}});
}
/* analysis page inside Reports: same design as History, filtered by the Reports filters (activity level) */
function repAnalysisData(){const f=S.f.rep;
  const ok=a=>(!f.from||(a.EndDate||a.StartDate)>=f.from)&&(!f.to||a.StartDate<=f.to)&&(!f.dept||nk(a.Department)===f.dept)&&(!f.type||a.Type===f.type)&&(!f.st||a.Status===f.st);
  return hvData({f:{from:f.from,to:f.to,div:'',xy:f.xy},rows:historyRows(p=>{const a=actById(p.ActivityID);return a&&ok(a);})});}
function buildReport(){
  const f=S.f.rep;
  const acts=S.acts.filter(a=>(!f.from||(a.EndDate||a.StartDate)>=f.from)&&(!f.to||a.StartDate<=f.to)&&(!f.dept||nk(a.Department)===f.dept)&&(!f.type||a.Type===f.type)&&(!f.st||a.Status===f.st));
  const ids=new Set(acts.map(a=>a.ActivityID));const live=acts.filter(a=>a.Status!=='Cancelled');
  const P=a=>S.partsByAct[a.ActivityID]||[];
  const grp=(key)=>{const g={};live.forEach(a=>{const k=key(a)||'—';(g[k]=g[k]||[]).push(a);});return Object.keys(g).sort().map(k=>({k,acts:g[k],n:g[k].length,parts:g[k].reduce((s,a)=>s+P(a).length,0),hours:g[k].reduce((s,a)=>s+num(a.DurationHours),0),days:g[k].reduce((s,a)=>s+num(a.DurationDays),0),cost:g[k].reduce((s,a)=>s+num(a.Cost),0),budget:g[k].reduce((s,a)=>s+num(a.Budget),0)}));};
  const N=(k,l,d)=>({k,l,cls:'num',sv:r=>num(r[k]),r:r=>fmtN(r[k],d||0),x:r=>num(r[k])});
  const exclNote=S.lang==='lo'?'ບໍ່ລວມກິດຈະກຳທີ່ຍົກເລີກ.':'Cancelled activities are excluded.';
  switch(f.r){
   case 'r_month':return{note:exclNote,cols:[{k:'k',l:t('month')},N('n',t('count')),N('parts',t('invited')),N('days',t('days'),1),N('hours',t('hours'),1),N('budget',t('budget'),2),N('cost',t('cost'),2)],rows:grp(a=>a.StartDate.slice(0,7))};
   case 'r_dept':return{note:exclNote,cols:[{k:'k',l:fl('Department')},N('n',t('count')),N('parts',t('invited')),N('days',t('days'),1),N('hours',t('hours'),1),N('budget',t('budget'),2),N('cost',t('cost'),2)],rows:grp(a=>a.Department||t('companyWide'))};
   case 'r_emp':return{cols:histCols(true),rows:historyRows(p=>ids.has(p.ActivityID)).sort((a,b)=>a.EmployeeID.localeCompare(b.EmployeeID)||a.StartDate.localeCompare(b.StartDate))};
   case 'r_att':return{note:t('kpiRateNote'),cols:[{k:'ActivityID',l:fl('ActivityID')},{k:'Title',l:fl('Title')},{k:'StartDate',l:fl('StartDate'),r:r=>fmtD(r.StartDate)},{k:'Status',l:fl('Status'),r:r=>badge(r.Status),x:r=>r.Status},N('inv',t('invited')),N('pr',t('present')),N('la',t('late')),N('ab',t('absent')),N('ex',t('excused')),N('pe',t('pending')),{k:'rate',l:t('rate'),cls:'num',sv:r=>r.rate??-1,r:r=>r.rate==null?'—':r.rate+'%',x:r=>r.rate==null?'':r.rate/100}],
     rows:acts.map(a=>{const p=P(a),c=s=>p.filter(x=>x.Attendance===s).length;const pr=c('Present'),la=c('Late'),ab=c('Absent');return{...a,inv:p.length,pr,la,ab,ex:c('Excused'),pe:c(''),rate:pr+la+ab?Math.round((pr+la)*100/(pr+la+ab)):null};})};
   case 'r_comp':return{cols:[{k:'ActivityID',l:fl('ActivityID')},{k:'Title',l:fl('Title')},{k:'StartDate',l:fl('StartDate'),r:r=>fmtD(r.StartDate)},{k:'Status',l:fl('Status'),r:r=>badge(r.Status),x:r=>r.Status},N('inv',t('invited')),N('co',t('completed')),N('nc',tv('Not Completed')),N('pe',t('pending'))],
     rows:acts.map(a=>{const p=P(a);return{...a,inv:p.length,co:p.filter(x=>x.Completion==='Completed').length,nc:p.filter(x=>x.Completion==='Not Completed').length,pe:p.filter(x=>!x.Completion).length};})};
   case 'r_dur':{const m={};S.parts.filter(p=>ids.has(p.ActivityID)&&(p.Attendance==='Present'||p.Attendance==='Late')).forEach(p=>{const a=actById(p.ActivityID);if(a.Status==='Cancelled')return;const r=m[p.EmployeeID]=m[p.EmployeeID]||{EmployeeID:p.EmployeeID,n:0,days:0,hours:0};r.n++;r.days+=num(a.DurationDays);r.hours+=num(a.DurationHours);});
     return{note:S.lang==='lo'?'ນັບສະເພາະ ມາ / ມາຊ້າ.':'Counts only Present / Late attendance.',cols:[{k:'EmployeeID',l:fl('EmployeeID')},{k:'Name',l:fl('Name')},{k:'Division',l:fl('Division')},N('n',t('activitiesAttended')),N('days',t('days'),1),N('hours',t('hours'),1)],
      rows:Object.values(m).map(r=>{const e=empById(r.EmployeeID)||{};return{...r,Name:empName(e),Division:e.Division||''};})};}
   case 'r_cost':{const rows=acts.map(a=>{const n=P(a).length;return{...a,b:num(a.Budget),c:num(a.Cost),v:num(a.Budget)-num(a.Cost),pp:n&&a.Cost?num(a.Cost)/n:0,n};});
     const tot={ActivityID:'TOTAL',Title:'',Type:'',Department:'',n:rows.reduce((s,r)=>s+r.n,0),b:rows.reduce((s,r)=>s+r.b,0),c:rows.reduce((s,r)=>s+r.c,0)};tot.v=tot.b-tot.c;tot.pp=tot.n?tot.c/tot.n:0;
     return{cols:[{k:'ActivityID',l:fl('ActivityID')},{k:'Title',l:fl('Title')},{k:'Type',l:fl('Type'),r:r=>esc(tv(r.Type))},{k:'Department',l:fl('Department')},{k:'Status',l:fl('Status'),r:r=>r.Status?badge(r.Status):'',x:r=>r.Status||''},N('n',t('invited')),N('b',t('budget'),2),N('c',t('cost'),2),N('v',t('variance'),2),N('pp',t('costPerHead'),2)],rows:rows.length?[...rows,tot]:[]};}
   case 'r_up':{const td=todayStr();return{cols:[{k:'StartDate',l:fl('StartDate'),r:r=>fmtD(r.StartDate)},{k:'StartTime',l:fl('StartTime')},{k:'Title',l:fl('Title')},{k:'Type',l:fl('Type'),r:r=>esc(tv(r.Type))},{k:'Trainer',l:fl('Trainer')},{k:'Location',l:fl('Location'),r:r=>esc(tv(r.Location))},{k:'Department',l:fl('Department')},N('n',t('invited')),{k:'Status',l:fl('Status'),r:r=>badge(r.Status),x:r=>r.Status}],
     rows:live.filter(a=>a.StartDate>=td).sort((a,b)=>a.StartDate.localeCompare(b.StartDate)).map(a=>({...a,n:P(a).length}))};}
  }
}

        const ok=wb.SheetNames.filter(n=>!EXCLUDE_SHEETS.includes(normH(n)));

function impLoadSheet(keepHdr){
  const I=S.imp,ws=I.wb.Sheets[I.sheet];
  const text=XLSX.utils.sheet_to_json(ws,{header:1,raw:false,defval:''}),raw=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:''});
  if(!keepHdr||I.hdr==null){I.hdr=0;for(let i=0;i<Math.min(15,text.length);i++){if(text[i].filter(v=>String(v).trim()!=='').length>=3){I.hdr=i;break;}}}
  I.headers=(text[I.hdr]||[]).map(h=>String(h).trim());
  I.dataRows=[];for(let i=I.hdr+1;i<text.length;i++){if(text[i].some(v=>String(v).trim()!==''))I.dataRows.push({excelRow:i+1,text:text[i],raw:raw[i]||[]});}
  I.map={};I.map2={};const used=new Set();const nh=I.headers.map(normH);
  NAME2.forEach(k=>{for(const[a,b]of NAME_PAIRS[k]){const i=nh.indexOf(a),j=nh.indexOf(b);if(i>=0&&j>=0){I.map[k]=i;I.map2[k]=j;used.add(i);used.add(j);break;}}});
  EMP_FIELDS.forEach(k=>{if(I.map[k]>=0)return;let idx=-1;for(const s of SYN[k]){const j=nh.findIndex((h,j)=>h===normH(s)&&!used.has(j));if(j>=0){idx=j;break;}}I.map[k]=idx;if(idx>=0)used.add(idx);});
  I.srcFromSheet=I.map.SourceSheet<0;I.step=2;
}
function normDate(rawV,textV){
  if(rawV===''||rawV==null)return{v:''};
  if(typeof rawV==='number'&&rawV>59&&rawV<80000){const p=XLSX.SSF.parse_date_code(rawV);if(p)return{v:p.y+'-'+pad(p.m)+'-'+pad(p.d)};}
  const s=String(textV||rawV).trim();let m;
  if((m=/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/.exec(s)))return valid(m[1],m[2],m[3],s);
  if((m=/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})$/.exec(s)))return valid(m[3],m[2],m[1],s);
  return{v:s,warn:true};
  function valid(y,mo,d,s){const D=new Date(+y,+mo-1,+d);if(D.getMonth()!==+mo-1||D.getDate()!==+d)return{v:s,warn:true};return{v:y+'-'+pad(+mo)+'-'+pad(+d)};}
}
function cellVal(d,k){const I=S.imp,a=I.map[k],b=I.map2?I.map2[k]:-1;const v=x=>x>=0?String(d.text[x]??'').trim():'';return [v(a),b>=0&&b!==a?v(b):''].filter(Boolean).join(' ').replace(/\s+/g,' ');}
function impPreview(){
  const I=S.imp;if(I.map.EmployeeID<0){toast(fl('EmployeeID')+' → '+t('notMapped'),'bad');return;}
  const rows=I.dataRows.map((d,ix)=>{
    const emp={},warns=[],errors=[];
    EMP_FIELDS.forEach(k=>{const j=I.map[k];if(j<0){emp[k]='';return;}
      if(DATE_FIELDS.includes(k)){const r=normDate(d.raw[j],d.text[j]);emp[k]=r.v;if(r.warn)warns.push(fl(k)+': "'+r.v+'" ?');}
      else emp[k]=cellVal(d,k);});
    if(/^(male|m)$/i.test(emp.Gender))emp.Gender='Male';else if(/^(female|f)$/i.test(emp.Gender))emp.Gender='Female';
    if(emp.EndDate&&!FORMER_RE.test(nk(emp.EmploymentStatus))&&emp.EndDate<=todayStr())warns.push(t('endDateWarn')+' ('+emp.EmploymentStatus+', '+fmtD(emp.EndDate)+')');
    if(I.srcFromSheet&&!emp.SourceSheet)emp.SourceSheet=I.sheet;
    if(!emp.EmployeeID)errors.push(fl('EmployeeID')+' — missing');
    if(!emp.NameEN&&!emp.NameLA)errors.push(fl('NameEN')+' / '+fl('NameLA')+' — missing');
    if(emp.Email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emp.Email))warns.push(fl('Email')+': "'+emp.Email+'" — '+t('badFormat'));
    // keep the original text of the MAPPED columns only (salary, bank, address etc. are never stored)
    const usedCols=new Set();EMP_FIELDS.forEach(k=>{if(I.map[k]>=0)usedCols.add(I.map[k]);if(I.map2[k]>=0)usedCols.add(I.map2[k]);});
    const rawObj={};I.headers.forEach((h,j)=>{if(usedCols.has(j)&&String(d.text[j]??'')!=='')rawObj[h||('col'+(j+1))]=d.text[j];});rawObj._sheet=I.sheet;rawObj._row=d.excelRow;
    return{n:d.excelRow,emp,warns,errors,raw:JSON.stringify(rawObj),key:emp.EmployeeID.toLowerCase(),action:'skip'};
  });
  const cnt={};rows.forEach(r=>{if(r.emp.EmployeeID)cnt[r.key]=(cnt[r.key]||0)+1;});
  const dbIdx={};S.emps.forEach(e=>dbIdx[e.EmployeeID.toLowerCase()]=e);
  rows.forEach(r=>{
    if(r.errors.length){r.st='error';return;}
    if(cnt[r.key]>1){r.st='dup';return;}
    classifyExisting(r,dbIdx);
  });
  I.rows=rows;I.dupPick={};I.tab='all';I.step=3;S.tbl.imp={p:1,k:null,d:1};rerender();
}
function classifyExisting(r,dbIdx){
  const e=dbIdx[r.key];if(!e){r.st='new';return;}
  r.diff=EMP_FIELDS.filter(f=>f!=='EmployeeID'&&r.emp[f]&&r.emp[f]!==(e[f]||'')).map(f=>({f,old:e[f]||'',nw:r.emp[f]}));
  r.st=r.diff.length?'exists':'same';r.action='skip';
}
async function impCommit(){
  const I=S.imp,R=I.rows;
  const dbIdx={};S.emps.forEach(e=>dbIdx[e.EmployeeID.toLowerCase()]=e);
  const inserts=[],updates=[],review=[];let skipped=0;
  const handle=(r)=>{
    const e=dbIdx[r.key];
    if(!e){inserts.push({...r.emp,_raw:r.raw});return;}
    const diff=EMP_FIELDS.filter(f=>f!=='EmployeeID'&&r.emp[f]&&r.emp[f]!==(e[f]||''));
    if(!diff.length)return 'same';
    if(r.action==='fill'||r.action==='overwrite'){updates.push({employee:{...r.emp,_raw:r.raw},mode:r.action});return;}
    skipped++;review.push({EmployeeID:r.emp.EmployeeID,Reason:'Employee ID exists in database with different data',Resolution:'Skipped (not imported)',raw:r.raw});
  };
  R.filter(r=>r.st==='new'||r.st==='exists').forEach(handle);
  const groups={};R.filter(r=>r.st==='dup').forEach(r=>(groups[r.key]=groups[r.key]||[]).push(r));
  Object.entries(groups).forEach(([k,g])=>{const pick=I.dupPick[k];
    g.forEach(r=>{if(pick===r.n){const res=handle(r);if(res==='same'){}}
      else{skipped++;review.push({EmployeeID:r.emp.EmployeeID,Reason:`Duplicate Employee ID in file (${g.length} rows)`,Resolution:pick?`Not imported — row ${pick} used`:'Not imported — pending HR review',raw:r.raw});}});});
  const errs=R.filter(r=>r.st==='error');
  const msg=`${t('inserted')}: ${inserts.length} · ${t('updated')}: ${updates.length} · ${t('skippedN')}: ${skipped} · ${t('errorsN')}: ${errs.length}`;
  if(!await ask(t('confirmImport')+'? '+msg))return;
  await KFX.job({title:LX('ນຳເຂົ້າພະນັກງານ','Importing employees'),icon:'import',
   steps:[LX('ກວດຂໍ້ມູນ ແລະ ຊື່ຊ້ຳ','Checking rows and duplicates'),LX('ບັນທຶກລົງລະບົບ','Saving'),LX('ໂຫຼດຂໍ້ມູນໃໝ່','Reloading data')],
   run:async step=>{step(0);await new Promise(r=>setTimeout(r,250));step(1);
    const res=await call('import.commit',{batch:'IMP-'+todayStr().replace(/-/g,'')+'-'+Date.now().toString().slice(-5),fileName:I.fileName,sheetName:I.sheet,inserts,updates,review,skippedCount:skipped});
    res.errorsTotal=errs.length+res.errors.length;
    I.result=res;I.issues=[...errs.map(r=>({row:r.n,id:r.emp.EmployeeID,issue:r.errors.join('; ')})),...res.errors.map(x=>({row:'',id:x.id,issue:x.msg})),...review.map(x=>({row:JSON.parse(x.raw)._row,id:x.EmployeeID,issue:x.Reason+' — '+x.Resolution})),...R.filter(r=>r.warns.length&&r.st!=='error').map(r=>({row:r.n,id:r.emp.EmployeeID,issue:'Warning: '+r.warns.join('; ')}))];
    step(2);I.step=4;await loadAll();go('import');return msg;}});
}

function logoFromFile(f){return new Promise((res,rej)=>{

  fr.onload=()=>{const img=new Image();
    img.onload=()=>{try{
      let w=img.naturalWidth||256,h=img.naturalHeight||256;const sc=Math.min(1,256/Math.max(w,h));w=Math.max(1,Math.round(w*sc));h=Math.max(1,Math.round(h*sc));
      const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
      let u=c.toDataURL('image/png');
      if(u.length>300000){const wq=c.toDataURL('image/webp',0.9);u=/^data:image\/webp/.test(wq)&&wq.length<=300000?wq:c.toDataURL('image/jpeg',0.85);}
      if(u.length>380000)return rej(new Error(t('ad_logoBig')));
      res(u);}catch(e){rej(new Error(t('ad_logoType')));}};
    img.onerror=()=>rej(new Error(t('ad_logoType')));img.src=fr.result;};

  const today=parseD(todayStr()),age=v=>{const x=parseD(String(v||'').slice(0,10));return x?Math.round((today-x)/864e5):null;};
  const admins=S.users.filter(u=>u.Role==='admin'&&u.Active==='Yes').length,locked=S.users.filter(u=>u.Locked==='Yes').length;
  const ra=age(s.lastAccessReview),ba=age(s.lastBackup);

   <div class="card"><h3>${t('ad_secStatus')}</h3><ul class="chkl">${C.map(([k,x])=>`<li><span class="st ${k}">${k==='ok'?'✓':'!'}</span><span>${esc(x)}</span></li>`).join('')}</ul>

    <p class="small">${s.lastAccessReview?esc(fmtDT(s.lastAccessReview))+' · '+t('ad_by')+' '+esc(s.lastAccessReviewBy||''):t('ad_never')}</p>
    <button class="btn" data-act="admReview">${ic('check',16)} ${t('ad_reviewBtn')}</button></div></div>`;
  document.querySelectorAll('[data-sec]').forEach(el=>el.oninput=()=>{d[el.dataset.sec]=el.value;});

const libP={};
function needLib(k){if(k==='qr'&&window.qrcode)return Promise.resolve();if(k==='jsqr'&&window.jsQR)return Promise.resolve();
  return libP[k]||(libP[k]=new Promise((res,rej)=>{const s=document.createElement('script');s.src=LIBS[k];s.onload=()=>res();s.onerror=()=>{libP[k]=null;rej(new Error(t('ci_libFail')));};document.head.appendChild(s);}));}

function urlParams(){return new Promise(res=>{

  try{res(Object.fromEntries(new URLSearchParams(location.search)));}catch(e){res({});}});}

  return d;}

function beep(ok){try{const C=window.AudioContext||window.webkitAudioContext;const c=S._ac||(S._ac=new C());const o=c.createOscillator(),g=c.createGain();
  o.frequency.value=ok?880:220;g.gain.value=.08;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+(ok?.12:.3));}catch(e){}}
/* welcome chime for the meeting screen: soft bell arpeggio (on time) / calmer two notes (late) */
function audioCtx(){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;const c=S._ac||(S._ac=new C());if(c.state==='suspended')c.resume();return c;}
function ciChime(late){try{const c=audioCtx();if(!c)return;const t0=c.currentTime+.03;
  const master=c.createGain();master.gain.value=.34;master.connect(c.destination);
  const bell=(f,at,len,vol)=>{[[1,1],[2,.32],[3,.12],[4.2,.05]].forEach(([m,v])=>{const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=f*m;
      g.gain.setValueAtTime(0,at);g.gain.linearRampToValueAtTime(vol*v,at+.012);g.gain.exponentialRampToValueAtTime(.0001,at+len/(m>1?m*.7:1));
      o.connect(g);g.connect(master);o.start(at);o.stop(at+len+.05);});};
  if(late){bell(784,t0,1.2,.8);bell(659.3,t0+.22,1.5,.7);}
  else{[1046.5,1318.5,1568,2093].forEach((f,i)=>bell(f,t0+i*.11,i===3?1.8:1.1,i===3?.9:.75));}
}catch(e){}}
function actWhen(a){return fmtD(a.StartDate)+(a.EndDate&&a.EndDate!==a.StartDate?' – '+fmtD(a.EndDate):'')+(a.StartTime?' · '+esc(a.StartTime)+(a.EndTime?'–'+esc(a.EndTime):''):'');}

async function ciLookup(){const C=S.ci,v=($('#ciId').value||'').trim();C.typed=v;if(!v)return;C.err='';
  try{C.emp=await call('checkin.lookup',{ticket:C.ticket,emp:v});C.step='confirm';}
  catch(e){if(e.error==='CI_EXPIRED'){C.step='err';C.err=errText(e);}else C.err=errText(e);}
  ciPub();}
async function ciSubmit(){const C=S.ci;C.err='';
  try{const r=await call('checkin.submit',{ticket:C.ticket,emp:C.emp.EmployeeID,device:C.dev});C.res=r;C.used=r.used||C.used;C.step='done';}
  catch(e){if(e.error==='CI_EXPIRED'||e.error==='CI_CLOSED'){C.step='err';C.err=errText(e);}else C.err=errText(e);}
  ciPub();}

function ciActs(){const td=todayStr();const L=S.acts.filter(a=>a.Status!=='Cancelled');

  const up=L.filter(a=>a.StartDate>td).sort((a,b)=>a.StartDate.localeCompare(b.StartDate));
  const past=L.filter(a=>(a.EndDate||a.StartDate)<td).sort((a,b)=>b.StartDate.localeCompare(a.StartDate)).slice(0,30);
  return {now,up,past};}

async function ciToken(){
  const G=S.ci2,id=G.actId;clearTimeout(G.tk);clearInterval(G.cd);
  try{await needLib('qr');const r=await call('checkin.token',{id},{silent:true});if(S.page!=='checkin'||G.actId!==id)return;
    G.k=r.k;G.url=(apiMode()||!r.url)?location.href.split('#')[0].split('?')[0]:r.url;G.link=G.url+'?ci='+encodeURIComponent(id)+'&k='+r.k;
    const src=qrImg(G.link,10);['#ciQrImg','#ciPresentImg'].forEach(s=>{const im=$(s);if(im)im.src=src;});
    if(r.fixed){const txt=t('ci_fixed');['#ciCd','#ciPresentCd'].forEach(x=>{const el=$(x);if(el)el.textContent=txt;});return;}
    G.secs=r.seconds;const tick=()=>{const cd=$('#ciCd'),cd2=$('#ciPresentCd');const txt=t('ci_refresh').replace('{n}',G.secs);if(cd)cd.textContent=txt;if(cd2)cd2.textContent=txt;G.secs--;};
    tick();G.cd=setInterval(tick,1000);G.tk=setTimeout(ciToken,(r.seconds+1)*1000);}
  catch(e){const cd=$('#ciCd');if(cd)cd.textContent=errText(e);G.tk=setTimeout(ciToken,8000);}
}

async function ciFeed(){const G=S.ci2,id=G.actId;

    S.parts=S.parts.filter(p=>p.ActivityID!==id).concat(rows);reindex();ciList();}catch(e){}}
async function ciHr(code){
  code=String(code||'').trim();const G=S.ci2;if(!code)return;const sc=$('#ciScan');if(sc)sc.value='';
  try{const r=await call('checkin.hr',{id:G.actId,code},{silent:true});
    if(r.row){S.parts=S.parts.filter(p=>!(p.ActivityID===G.actId&&p.EmployeeID===r.EmployeeID)).concat([r.row]);reindex();}
    ciLast(r.already?'warn':'ok',r);beep(!r.already);ciList();}
  catch(e){ciLast('bad',{msg:errText(e),code});beep(false);}
  if(sc)sc.focus();
}

/* Original Lao-style ornaments (kanok flame, prachamyam band, rosette, lotus divider) drawn as SVG */
function ornDefs(id){return `<defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff1c4"/><stop offset=".45" stop-color="#e2b866"/><stop offset="1" stop-color="#a8762c"/></linearGradient></defs>`;}
/* one kanok flame: body + curled tip + inner veins; drawn pointing up, base at (0,0) */
function kanok(s,flip){return `<g transform="scale(${flip?-s:s},${s})">
 <path d="M-18 0 C-30 -30 -30 -60 -16 -90 C-6 -112 -14 -136 -34 -160 C-4 -150 14 -134 14 -112 L28 -126 C26 -108 22 -100 12 -94 C28 -92 36 -84 36 -70 L50 -84 C48 -64 42 -56 30 -50 C44 -46 52 -36 50 -22 L62 -34 C60 -14 46 -4 24 0 Z"/>
 <path d="M-34 -160 C-46 -168 -54 -156 -47 -149 C-42 -144 -36 -149 -39 -153" fill="none" stroke-width="3.5" stroke-linecap="round"/>
 <path d="M0 -6 C-12 -40 -10 -80 -2 -100 C4 -114 -4 -132 -20 -148 M4 -36 C16 -42 26 -48 36 -56 M2 -74 C12 -80 20 -88 26 -100 M-8 -18 C-18 -36 -20 -56 -14 -74" fill="none" stroke="#0a1f4d" stroke-opacity=".55" stroke-width="2.4" stroke-linecap="round"/></g>`;}
/* corner piece (drawn for the bottom-left corner; mirror with CSS for the others) */
function ornCorner(id){return `<svg viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg">${ornDefs(id)}<g fill="url(#${id})" stroke="url(#${id})">
 <path d="M10 10 V250 C10 286 34 310 70 310 H310" fill="none" stroke-width="2"/>
 <path d="M22 30 V246 C22 278 42 298 74 298 H290" fill="none" stroke-width=".9"/>
 <g transform="translate(58 282) rotate(42)">${kanok(1.02)}</g>

 <g transform="translate(74 290) rotate(80)">${kanok(.62)}</g>
 <g transform="translate(34 150) rotate(12)">${kanok(.36,true)}</g>
 <g transform="translate(176 290) rotate(84)">${kanok(.36)}</g>
 <path d="M40 300 C30 300 26 290 32 284 C38 278 48 282 46 290" fill="none" stroke-width="3" stroke-linecap="round"/>
 <circle cx="10" cy="10" r="4"/><circle cx="310" cy="310" r="4"/>
 <path d="M10 60 l-6 7 l6 7 l6 -7z M260 310 l7 -6 l7 6 l-7 6z" stroke="none"/></g></svg>`;}

/* live counter, scrolling list and big welcome card for each new check-in */
function ciPresentSync(){
  const G=S.ci2,a=actById(G.actId),d=$('#ciPresent');if(!a||!d)return;const c=ciCounts(a);
  const fresh=c.insList.filter(p=>!G.seen.has(p.EmployeeID)).sort((x,y)=>ciKey(x).localeCompare(ciKey(y)));
  fresh.forEach(p=>{G.seen.add(p.EmployeeID);G.newIds.add(p.EmployeeID);if(p.CheckInAt)G.wq.push(p);});   // welcome card only for real scans
  const n=$('#ciPresentN');if(n&&n.textContent!==String(c.ins)){n.textContent=c.ins;n.classList.remove('ci-pop');void n.offsetWidth;n.classList.add('ci-pop');}
  const onListIn=c.ins-c.walk,pct=c.list?Math.min(100,Math.round(onListIn*100/c.list)):0;
  $('#ciPresentOf').textContent=c.list?'/ '+c.list:'';
  $('#ciPresentBar').style.width=(c.list?pct:(c.ins?100:0))+'%';
  $('#ciPresentBar').parentElement.style.display=c.list?'':'none';
  $('#ciPresentChips').innerHTML=`<span class="c-ok">${t('ci_onTime')} <b>${c.ins-c.late}</b></span><span class="c-late">${t('late')} <b>${c.late}</b></span>${c.walk?`<span class="c-walk">${t('ci_walkInN')} <b>${c.walk}</b></span>`:''}${c.list?`<span class="c-wait">${t('ci_notYet')} <b>${Math.max(0,c.list-onListIn)}</b></span><span>${pct}%</span>`:''}`;
  $('#ciFeedN').textContent=c.ins;
  const L=$('#ciFlist');
  const asc=c.insList.slice().reverse();   // first to arrive at the top, numbered in order
  L.innerHTML=asc.length?asc.map((p,i)=>{const e=empById(p.EmployeeID)||{EmployeeID:p.EmployeeID};const late=p.Attendance==='Late';
    return `<div class="ci-fi${G.newIds.has(p.EmployeeID)?' new':''}"><span class="no">${i+1}</span>${ciAv(e,p.EmployeeID)}<div class="nm"><b>${esc(e.NameLA||empName(e)||p.EmployeeID)}</b><small>${esc(p.EmployeeID)}${e.Position?' · '+esc(tv(e.Position)):''}</small></div><div class="tm">${p.CheckInAt?esc(hhmm(p.CheckInAt)):'✓'}<small class="${late?'s-late':'s-ok'}">${!p.CheckInAt?t('ci_mManual'):late?t('late'):t('ci_onTime')}${p.WalkIn==='Yes'?' · '+t('ci_walkTag'):''}</small></div></div>`;}).join('')
    :`<div class="ci-fempty">${t('ci_feedEmpty')}</div>`;
  if(fresh.length){L.scrollTop=L.scrollHeight;G.scrollPause=Date.now()+6000;}
  ciWelcomeNext();
}
/* avatar with the employee photo when there is one (photos are fetched once, in the background) */
function ciAv(e,id){const ph=S.photos&&S.photos[id];
  if(!ph&&e.HasPhoto==='Yes'){const G=S.ci2;G.phReq=G.phReq||new Set();if(!G.phReq.has(id)){G.phReq.add(id);
    call('employee.photo',{id},{silent:true}).then(r=>{if(r&&r.Photo){(S.photos||(S.photos={}))[id]=r.Photo;ciPhotoFill(id);}}).catch(()=>{});}}
  return `<span class="av" data-ph="${esc(id)}" style="--c:${avc(id)}">${ph?`<img src="${esc(ph)}" alt="">`:esc(initials(e))}</span>`;}
function ciPhotoFill(id){const ph=S.photos[id];document.querySelectorAll('#ciFlist .av[data-ph]').forEach(a=>{if(a.dataset.ph===id)a.innerHTML=`<img src="${esc(ph)}" alt="">`;});}
function ciAutoScroll(){const G=S.ci2;clearInterval(G.as);G.dir=1;
  G.as=setInterval(()=>{const L=$('#ciFlist');if(!L){clearInterval(G.as);return;}if(Date.now()<(G.scrollPause||0))return;
    if(L.scrollHeight<=L.clientHeight+4){L.scrollTop=0;return;}
    if(L.scrollTop+L.clientHeight>=L.scrollHeight-1){G.scrollPause=Date.now()+2500;setTimeout(()=>{if($('#ciFlist'))$('#ciFlist').scrollTop=0;},2400);return;}
    L.scrollTop+=1;},40);}

    <div class="st ${late?'late':'ok'}">${esc(hhmm(p.CheckInAt))} · ${late?t('late'):t('ci_onTime')}${p.WalkIn==='Yes'?' · '+t('ci_walkTag'):''}</div>
    ${G.wq.length?`<div class="more">+${G.wq.length} ${t('ci_morePeople')}</div>`:''}</div>`;
  document.body.appendChild(w);if(G.sound)ciChime(late);
  if(e.HasPhoto==='Yes'&&!(S.photos&&S.photos[p.EmployeeID]))call('employee.photo',{id:p.EmployeeID},{silent:true}).then(r=>{if(r&&r.Photo){(S.photos||(S.photos={}))[p.EmployeeID]=r.Photo;const ph=$('#ciWPh');if(ph&&w.isConnected){ph.style.backgroundImage=`url('${r.Photo}')`;ph.textContent='';}}}).catch(()=>{});
  const ms=G.wq.length>2?2200:4000;

/* camera scanner (badge QR). Falls back to taking a photo when live video is not allowed. */
async function ciCamera(){
  try{await needLib('jsqr');}catch(e){toast(e.message,'bad');return;}
  modal(t('ci_camera'),`<div class="ci-cam"><video id="scVid" playsinline muted></video><div class="ci-aim"></div></div><p class="small muted" id="scMsg" style="text-align:center">${t('ci_camHelp')}</p>
    <label class="btn" style="cursor:pointer;justify-content:center;width:100%">${ic('camera',16)} ${t('ci_photo')}<input type="file" id="scFile" accept="image/*" capture="environment" style="display:none"></label>`,
    `<button class="btn" data-act="closeModal">${t('close')}</button>`,'sm');
  const G=S.ci2;G.scanLast='';G.scanAt=0;
  $('#scFile').onchange=ev=>{const f=ev.target.files[0];ev.target.value='';if(!f)return;const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const cv=document.createElement('canvas');const sc=Math.min(1,1280/Math.max(im.width,im.height));cv.width=im.width*sc;cv.height=im.height*sc;const x=cv.getContext('2d');x.drawImage(im,0,0,cv.width,cv.height);const d=x.getImageData(0,0,cv.width,cv.height);const q=jsQR(d.data,d.width,d.height);if(q&&q.data)ciHr(q.data);else{$('#scMsg').textContent=t('ci_noQr');beep(false);}};im.src=fr.result;};fr.readAsDataURL(f);};
  try{const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});G.stream=st;const v=$('#scVid');if(!v){scanStop();return;}v.srcObject=st;await v.play();
    const cv=document.createElement('canvas'),x=cv.getContext('2d',{willReadFrequently:true});
    const loop=()=>{if(!G.stream||!$('#scVid'))return scanStop();if(v.readyState>=2){cv.width=v.videoWidth;cv.height=v.videoHeight;x.drawImage(v,0,0);const d=x.getImageData(0,0,cv.width,cv.height);const q=jsQR(d.data,d.width,d.height,{inversionAttempts:'dontInvert'});
      if(q&&q.data){const now=Date.now();if(q.data!==G.scanLast||now-G.scanAt>4000){G.scanLast=q.data;G.scanAt=now;ciHr(q.data);}}}
      G.raf=requestAnimationFrame(loop);};loop();}
  catch(e){const m=$('#scMsg');if(m)m.textContent=t('ci_noCam');const v=$('#scVid');if(v)v.parentElement.style.display='none';}
}
function scanStop(){const G=S.ci2;if(!G)return;if(G.raf)cancelAnimationFrame(G.raf);G.raf=null;if(G.stream){G.stream.getTracks().forEach(tr=>tr.stop());G.stream=null;}}

async function printBadges(list){

  try{await needLib('qr');}catch(e){toast(e.message,'bad');return;}
  const need=list.filter(e=>e.HasPhoto==='Yes'&&!S.photos[e.EmployeeID]).slice(0,300);
  if(need.length){loading(true);try{for(const e of need){try{const r=await call('employee.photo',{id:e.EmployeeID},{silent:true});if(r&&r.Photo)S.photos[e.EmployeeID]=r.Photo;}catch(x){}}}finally{loading(false);}}
  const logo=hasLogo()?`<img src="${esc(cfg('logo'))}" alt="">`:`<span class="bl">KGS</span>`;

    <div class="bb"><div class="bp">${S.photos[e.EmployeeID]?`<img src="${esc(S.photos[e.EmployeeID])}" alt="">`:`<span>${esc(initials(e))}</span>`}</div>
    <div class="bt"><b>${esc(e.NameLA||e.NameEN||'')}</b><span>${esc(e.NameLA?e.NameEN||'':'')}</span><i>${esc(e.EmployeeID)}</i><small>${esc(e.Position||'')}</small></div>
    <img class="bq" src="${qrImg('KGS-EMP:'+e.EmployeeID,4)}" alt=""></div></div>`).join('');
  let pa=$('#printArea');if(!pa){pa=document.createElement('div');pa.id='printArea';document.body.appendChild(pa);}
  pa.innerHTML=`<div class="badge-sheet">${cards}</div>`;
  modal(t('ci_badges')+' ('+list.length+')',`<p class="small muted" style="margin-top:0">${t('ci_badgeHelp')}</p><div class="badge-prev"><div class="badge-sheet">${cards}</div></div>`,

}

/* ================= R2.3 EXTERNAL TRAINING & CERTIFICATES (one employee per record; the certificate file stays in Google Drive) ================= */
const EXT_KIND=['Training','Certification','Licence','Seminar','Study tour'],EXT_RESULT=['Pending','Passed','Failed','Attended'],EXT_PAID=['Company','Employee','Sponsor'];
const extDays=r=>r.CertExpiry?Math.round((new Date(r.CertExpiry+'T00:00:00')-new Date(todayStr()+'T00:00:00'))/864e5):null;
function extSt(r){if(!r.CertNo&&!r.CertLink&&!r.CertExpiry)return 'nocert';if(!r.CertExpiry)return 'noexp';const d=extDays(r);return d<0?'expired':d<=60?'soon':'valid';}
const EXT_ST={nocert:['b-same',()=>LX('ບໍ່ມີໃບຢັ້ງຢືນ','No certificate')],noexp:['b-Excused',()=>LX('ບໍ່ມີວັນໝົດອາຍຸ','No expiry')],valid:['b-Completed',()=>LX('ຍັງໃຊ້ໄດ້','Valid')],
  soon:['b-Late',r=>LX('ໃກ້ໝົດ · ອີກ '+extDays(r)+' ມື້','Expires in '+extDays(r)+' days')],expired:['b-Absent',()=>LX('ໝົດອາຍຸແລ້ວ','Expired')]};
const extBadge=r=>{const s=extSt(r),[c,l]=EXT_ST[s];return `<span class="badge ${c}">${esc(l(r))}</span>`;};
const EXT_RB={Pending:'b-Planned',Passed:'b-Completed',Failed:'b-Absent',Attended:'b-Excused'};
function extRows(){return (S.ext||[]).map(r=>{const e=empById(r.EmployeeID)||{};return{...r,_n:e.NameLA||e.NameEN||'',_ne:e.NameEN||'',_d:e.Division||'',_st:extSt(r)};});}
function extFiltered(){const f=S.f.ext,q=(f.q||'').toLowerCase().trim();
  return extRows().filter(r=>(!q||[r.EmployeeID,r._n,r._ne,r.Course,r.Provider,r.CertNo].some(v=>String(v||'').toLowerCase().includes(q)))&&(!f.year||String(r.StartDate||'').slice(0,4)===f.year)
    &&(!f.div||nk(r._d)===f.div)&&(!f.kind||r.Kind===f.kind)&&(!f.st||r._st===f.st));}
function extCols(){return[
  {k:'EmployeeID',l:fl('EmployeeID'),r:r=>`<b>${esc(r.EmployeeID)}</b>`,x:r=>r.EmployeeID},
  {k:'_n',l:LX('ຊື່ພະນັກງານ','Employee'),x:r=>r._n},{k:'_d',l:fl('Division'),x:r=>r._d},

  {k:'Provider',l:LX('ສະຖາບັນ / ຜູ້ຈັດ','Provider'),hide:true,x:r=>r.Provider},{k:'Location',l:LX('ສະຖານທີ່','Location'),hide:true,x:r=>r.Location},
  {k:'Kind',l:LX('ປະເພດ','Kind'),r:r=>esc(tv(r.Kind)),x:r=>tv(r.Kind)},

}

   <div class="ds-out wide form" style="padding:0">
    ${F(LX('ຊື່ ແລະ ນາມສະກຸນ','Full name'),I('Name','text','maxlength="80"'),'wide',1)}
    ${F(LX('ເບີໂທ','Phone'),I('Phone','tel','maxlength="30"'),'',1)}${F(LX('ເລກບັດປະຈຳຕົວ / Passport','ID card / passport no.'),I('IDCardNo','text','maxlength="40"'),'',1)}

const dsVal=k=>{const el=$('#ds_'+k);return el?(el.type==='checkbox'?el.checked:el.value.trim()):'';};
const dsEmpId=id=>{const v=dsVal(id);const x=(v.split(' · ')[0]||'').trim();return empById(x)?x:'';};
async function dmStaySave(id){
  const cur=id?DM().stays.find(x=>x.StayID===id):null;
  const ty=cur?cur.PersonType:(document.querySelector('[name=ds_type]:checked')||{}).value;
  const st={StayID:id||'',PersonType:ty,Bed:dsVal('Bed'),CheckIn:dsVal('CheckIn'),Remarks:dsVal('Remarks')};
  if(!cur){st.RoomID=dsVal('RoomID');if(!st.RoomID){toast(LX('ກະລຸນາເລືອກຫ້ອງ','Please choose a room'),'bad');return;}}
  if(ty==='Employee'&&!cur){st.EmployeeID=dsEmpId('emp');if(!st.EmployeeID){toast(LX('ກະລຸນາເລືອກພະນັກງານຈາກລາຍຊື່','Please pick an employee from the list'),'bad');return;}
    const r=dRoom(st.RoomID),g=dGenderKey((empById(st.EmployeeID)||{}).Gender);
    if(r&&g&&(r.Gender==='Male'||r.Gender==='Female')&&r.Gender!==g&&!await ask(LX('ເພດຂອງພະນັກງານບໍ່ກົງກັບຫ້ອງ ('+dGender(r.Gender)+'). ບັນທຶກຕໍ່ບໍ?','The employee\'s gender does not match the room ('+dGender(r.Gender)+'). Save anyway?')))return;}
  if(ty==='Outsider'){Object.assign(st,{Name:dsVal('Name'),Phone:dsVal('Phone'),IDCardNo:dsVal('IDCardNo'),Relation:dsVal('Relation'),SponsorID:dsEmpId('sp')||(dsVal('sp').split(' · ')[0]||'').trim(),EndDate:dsVal('EndDate'),Consent:dsVal('Consent')?'Yes':''});
    const miss=[['Name',LX('ຊື່','name')],['Phone',LX('ເບີໂທ','phone')],['IDCardNo',LX('ເລກບັດ','ID card')],['Relation',LX('ກ່ຽວຂ້ອງກັບໃຜ','relation')],['SponsorID',LX('ຜູ້ຮັບຮອງ','sponsor')],['EndDate',LX('ພັກຮອດວັນທີ','stay until')]].filter(([k])=>!st[k]).map(x=>x[1]);
    if(miss.length){toast(LX('ກະລຸນາໃສ່: ','Please fill in: ')+miss.join(', '),'bad');return;}
    if(st.Consent!=='Yes'){toast(LX('ຕ້ອງມີການຍິນຍອມກ່ອນ','Consent is required'),'bad');return;}}
  const send=async force=>{try{const r=await call('dorm.staySave',{stay:st,force:!!force});dmPut(r);toast(t('saved'),'ok');S.dmRoomId=r.RoomID;dmReopen();}
    catch(e){if(e.error==='DORM_FULL'){if(await ask(LX('ຫ້ອງນີ້ເຕັມແລ້ວ. ຍັງຈະເພີ່ມອີກບໍ? (ຈະຂຶ້ນແຈ້ງເຕືອນ "ເກີນ")','This room is full. Add anyway? (it will show as "over capacity")')))send(true);}else fail(e);}};
  send(false);
}

function dmMove(id){const s=DM().stays.find(x=>x.StayID===id);if(!s)return;S.dmBackRoom=true;
  modal(LX('ຍ້າຍຫ້ອງ','Move to another room')+' · '+dPerson(s).name,`<div class="form">
   <div class="fld wide"><label class="req">${LX('ຫ້ອງໃໝ່','New room')}</label><select class="in" id="mv_room">${opts(dmRoomOpts('',true).filter(o=>o[0]!==s.RoomID),'','— '+LX('ເລືອກຫ້ອງ','Choose a room')+' —')}</select></div>

   <div class="fld wide"><label>${LX('ເຫດຜົນ','Reason')}</label><input class="in" id="mv_reason" maxlength="200"></div></div>`,
   `<button class="btn" data-act="dmBack">${t('cancel')}</button><button class="btn pri" data-act="dmMoveGo" data-arg="${esc(id)}">${LX('ຍ້າຍ','Move')}</button>`);}
async function dmMoveGo(id){const p={id,RoomID:$('#mv_room').value,Bed:$('#mv_bed').value.trim(),date:$('#mv_date').value,reason:$('#mv_reason').value.trim()};
  if(!p.RoomID){toast(LX('ກະລຸນາເລືອກຫ້ອງ','Please choose a room'),'bad');return;}
  const send=async force=>{try{const r=await call('dorm.stayMove',Object.assign({force:!!force},p));dmPut([r.old,r.stay]);toast(LX('ຍ້າຍແລ້ວ','Moved'),'ok');dmReopen();}
    catch(e){if(e.error==='DORM_FULL'){if(await ask(LX('ຫ້ອງໃໝ່ເຕັມແລ້ວ. ຍ້າຍເຂົ້າຕໍ່ບໍ?','The new room is full. Move anyway?')))send(true);}else fail(e);}};send(false);}
function dmOut(id){const s=DM().stays.find(x=>x.StayID===id);if(!s)return;S.dmBackRoom=true;
  const hasMeal=DM().meals.some(m=>dMealOn(m)&&(s.PersonType==='Employee'?m.EmployeeID===s.EmployeeID:m.StayID===s.StayID));
  modal(LX('ອອກຈາກຫໍພັກ','Check out')+' · '+dPerson(s).name,`<div class="form">
   <div class="fld"><label class="req">${LX('ວັນທີອອກ','Check-out date')}</label><input class="in" type="date" id="co_date" value="${todayStr()}"></div>

   ${hasMeal?`<div class="fld wide"><label class="dm-consent"><input type="checkbox" id="co_meal" checked> ${LX('ຢຸດລາຍຊື່ກິນເຂົ້າ ນຳ','Also end the meal list entry')}</label></div>`:''}</div>`,

async function dmConfirm(ids,label){if(!ids.length){toast(LX('ບໍ່ມີຜູ້ພັກ','No residents'));return;}

function dmImpParse(A){

  const H=A[hi].map(x=>String(x).trim()),col=(...k)=>H.findIndex(h=>k.some(x=>h.toUpperCase().includes(x.toUpperCase())));
  const c={b:col('ຕຶກ','ຫໍພັກ','BUILDING'),f:col('ຊັ້ນ','FLOOR'),r:col('ເລກຫ້ອງ','ROOM'),g:col('ກຸ່ມ','GROUP'),cap:col('ຕຽງ','BED'),n:col('ຊື່','NAME'),id:col('ລະຫັດ','EMPLOYEE ID','ID'),ty:col('ປະເພດ','TYPE'),rm:col('ໝາຍເຫດ','REMARK')};

    if(!rooms[key])rooms[key]={Building:b,Floor:v(r,'f')||(no.match(/^(\d+)\//)||[])[1]||'',RoomNo:no,Gender:dmGroupKey(v(r,'g')),Capacity:v(r,'cap')||'4'};
    const name=v(r,'n');if(!name||name==='-')return;
    const out=/ນອກ|OUTSIDER/i.test(v(r,'ty'));let id=v(r,'id').toUpperCase(),how='';

    people.push({key,name,id,how:out?'out':how,cands:out||how==='id'?[]:dmMatchEmp(name),rem:v(r,'rm')});});

   ${over.length?`<div class="note warn small">⚠ ${LX('ຫ້ອງຄົນເກີນຕຽງ: ','Rooms with more people than beds: ')}${over.map(r=>esc(r.RoomNo)).join(', ')}</div>`:''}
   <div class="tbl-wrap" style="max-height:46vh;overflow:auto"><table class="tbl"><thead><tr><th>${LX('ຫ້ອງ','Room')}</th><th>${LX('ຊື່ໃນໄຟລ໌','Name in file')}</th><th>${LX('ພະນັກງານໃນລະບົບ','Employee in system')}</th><th>${fl('Status')}</th></tr></thead><tbody>${I.people.map((p,i)=>`<tr><td>${esc(I.rooms[p.key].RoomNo)}</td><td><b>${esc(p.name)}</b></td>
     <td>${p.how==='out'?'—':`<input class="in" list="dmiList" data-i="${i}" value="${p.id&&empById(p.id)?esc(label(empById(p.id))):''}" placeholder="${LX('ພິມລະຫັດ / ຊື່','type ID / name')}" style="min-width:240px">${p.cands.length>1&&!p.id?`<div class="small muted">${p.cands.map(e=>esc(e.EmployeeID)).join(', ')}</div>`:''}`}</td><td>${st(p)}</td></tr>`).join('')||`<tr><td colspan="4" class="empty">${LX('ບໍ່ມີຊື່ຜູ້ພັກ (ຈະສ້າງແຕ່ຫ້ອງ)','No names (rooms only)')}</td></tr>`}</tbody></table></div>
   <datalist id="dmiList">${curEmps().map(e=>`<option value="${esc(label(e))}">`).join('')}</datalist>

async function dmImpGo(){
  const I=S.dmi;if(!I)return;const date=$('#dmiDate').value||todayStr();
  const todo=I.people.filter(p=>p.id&&I.dupIds[p.id]===1),R=Object.values(I.rooms);
  if(!await ask(LX(`ບັນທຶກ ${R.filter(r=>!I.ex.has((r.Building+'|'+r.RoomNo).toUpperCase())).length} ຫ້ອງໃໝ່ ແລະ ${todo.length} ຜູ້ພັກ (ວັນເຂົ້າພັກ ${fmtD(date)})?`,`Save ${R.filter(r=>!I.ex.has((r.Building+'|'+r.RoomNo).toUpperCase())).length} new rooms and ${todo.length} residents (check-in ${fmtD(date)})?`)))return;
  closeModal();const res={rooms:0,stays:0,err:[]};
  await KFX.job({title:LX('ນຳເຂົ້າຫໍພັກ','Importing dormitory'),icon:'import',steps:[LX('ສ້າງຫ້ອງ','Creating rooms'),LX('ບັນທຶກຜູ້ພັກ','Saving residents')],run:async()=>{
    const idOf={};DM().rooms.forEach(r=>idOf[(r.Building+'|'+r.RoomNo).toUpperCase()]=r.RoomID);
    for(const r of R){const k=(r.Building+'|'+r.RoomNo).toUpperCase();if(idOf[k])continue;
      try{const x=await call('dorm.roomSave',{room:Object.assign({RoomType:'Bedroom',Status:'Active'},r)},{silent:true});DM().rooms.push(x);idOf[k]=x.RoomID;res.rooms++;}catch(e){res.err.push(r.RoomNo+': '+e.message);}}
    for(const p of todo){try{const s=await call('dorm.staySave',{stay:{PersonType:'Employee',EmployeeID:p.id,RoomID:idOf[p.key],CheckIn:date,Remarks:p.rem},force:true},{silent:true});dmPut(s);res.stays++;}catch(e){res.err.push(p.name+' ('+p.id+'): '+e.message);}}
  },onOk:()=>{toast(LX('ສ້າງຫ້ອງ ','Rooms ')+res.rooms+' · '+LX('ຜູ້ພັກ ','residents ')+res.stays,'ok');S.refresh&&S.refresh();
    if(res.err.length)modal(LX('ບາງແຖວບໍ່ໄດ້ບັນທຶກ','Some rows were not saved'),`<ul class="small">${res.err.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`,null);}});
}

   <input class="in search" id="fQ" placeholder="${t('search')}: ${fl('EmployeeID')} / ${fl('Name')}" value="${esc(f.q)}">
