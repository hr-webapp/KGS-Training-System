<!doctype html>
<html lang="lo">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>ລະບົບຫ້ອງແຖວ KGS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;500;600;700&family=Noto+Sans+Lao+Looped:wght@600;700&family=IBM+Plex+Mono:wght@500;600&family=Noto+Serif+Lao:wght@500;600;700&family=EB+Garamond:wght@500;600&family=Inter:wght@500;600;700&display=swap">
<style>
/* Layout: left rail (desktop) / top tab strip (phone) + working canvas; summary first, detail below. Ledger-green ink, brass highlight for money owed. */
:root{
  --bg:#eef2ef; --surface:#ffffff; --sunk:#e4eae6; --line:#d2dbd5; --fg:#15211c; --muted:#5b6a63;
  --accent:#1d6b57; --accent-2:#2f8f74; --accent-fg:#ffffff; --accent-soft:#d6ebe3;
  --rail:#123f34; --rail-fg:#cfe6dc; --rail-hi:#ffffff; --rail-sel:#1f5c4c;
  --brass:#a86b12; --brass-soft:#f6e6c8;
  --ok:#1f7a3f; --ok-soft:#dbf0e1; --warn:#9a6200; --warn-soft:#fbecd0; --bad:#b3261e; --bad-soft:#f8dcd9; --info:#2b5f9e; --info-soft:#dde8f6; --mute-soft:#e6ebe8;
  --f-body:"Phetsarath OT","Noto Sans Lao",system-ui,sans-serif;
  --f-head:"Noto Sans Lao Looped","Noto Sans Lao",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,monospace;
  --r:12px; --shadow:0 1px 2px rgba(18,40,32,.06),0 4px 14px rgba(18,40,32,.05);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1412; --surface:#161e1b; --sunk:#1e2824; --line:#2c3833; --fg:#e3ebe7; --muted:#97a8a0;
  --accent:#5cc3a2; --accent-2:#3fa587; --accent-fg:#0a1411; --accent-soft:#1b3a30;
  --rail:#0b1915; --rail-fg:#a9c6ba; --rail-hi:#ffffff; --rail-sel:#183a30;
  --brass:#e3ae5c; --brass-soft:#3a2c13;
  --ok:#6fd08f; --ok-soft:#173223; --warn:#e8b25a; --warn-soft:#3a2d14; --bad:#f08a80; --bad-soft:#3d1c19; --info:#8db8ec; --info-soft:#1b2a3d; --mute-soft:#222c28;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1412; --surface:#161e1b; --sunk:#1e2824; --line:#2c3833; --fg:#e3ebe7; --muted:#97a8a0;
  --accent:#5cc3a2; --accent-2:#3fa587; --accent-fg:#0a1411; --accent-soft:#1b3a30;
  --rail:#0b1915; --rail-fg:#a9c6ba; --rail-hi:#ffffff; --rail-sel:#183a30;
  --brass:#e3ae5c; --brass-soft:#3a2c13;
  --ok:#6fd08f; --ok-soft:#173223; --warn:#e8b25a; --warn-soft:#3a2d14; --bad:#f08a80; --bad-soft:#3d1c19; --info:#8db8ec; --info-soft:#1b2a3d; --mute-soft:#222c28;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--rail)}
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100%}
.rail{background:var(--rail);color:var(--rail-fg);position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px));display:flex;flex-direction:column;padding:18px 12px;gap:4px;padding-left:max(12px,env(safe-area-inset-left,0px))}
.logo{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.logo .mk{width:36px;height:36px;border-radius:9px;background:var(--accent-2);display:grid;place-items:center;flex:0 0 auto;color:#fff}
.logo b{font-family:var(--f-head);color:var(--rail-hi);font-size:16px;line-height:1.25;display:block}
.logo span{font-size:12px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;border:0;background:transparent;color:var(--rail-fg);font:inherit;font-weight:600;padding:9px 12px;border-radius:9px;cursor:pointer;text-align:left;white-space:nowrap}
.nav button:hover{background:var(--rail-sel);color:var(--rail-hi)}
.nav button[aria-current="page"]{background:var(--rail-hi);color:var(--rail)}
.badge{margin-left:auto;background:var(--bad);color:#fff;font-size:11px;padding:0 7px;border-radius:999px;font-family:var(--f-num)}
.ico{width:19px;height:19px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.rail .who{margin-top:auto;font-size:12px;padding:10px 8px 0;border-top:1px solid var(--rail-sel)}
.canvas{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.wrap{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.tb{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:12px}
.tb h1{font-family:var(--f-head);font-size:21px;margin:0;flex:1;min-width:0;text-wrap:balance}
.mnav{display:none}
main{padding-block:20px 70px;display:flex;flex-direction:column;gap:18px;max-width:1240px;width:100%}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  body::before{background:var(--bg)}
  .wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .mnav{display:flex;gap:4px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
  .mnav button{flex:0 0 auto;display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font:inherit;font-weight:600;font-size:13.5px;padding:6px 11px;border-radius:999px;cursor:pointer}
  .mnav button[aria-current="page"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
  .mnav .ico{width:16px;height:16px}
}
h2{font-family:var(--f-head);font-size:18px;margin:0;text-wrap:balance}
h3{font-family:var(--f-head);font-size:15.5px;margin:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:12px;min-width:0;box-shadow:var(--shadow)}
.panel.flat{box-shadow:none;background:var(--sunk);border-color:transparent}
.ph{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ph h3{flex:1;min-width:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;grid-template-columns:auto 1fr;gap:2px 12px;align-items:center;box-shadow:var(--shadow)}
.kpi .ki{grid-row:span 3;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.kpi.k-brass .ki{background:var(--brass-soft);color:var(--brass)}
.kpi.k-bad .ki{background:var(--bad-soft);color:var(--bad)}
.kpi.k-info .ki{background:var(--info-soft);color:var(--info)}
.kpi small{color:var(--muted);font-size:12.5px}
.kpi b{font-family:var(--f-num);font-size:21px;font-variant-numeric:tabular-nums;line-height:1.25}
.kpi em{font-style:normal;font-size:12px;color:var(--muted)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.muted{color:var(--muted)} .small{font-size:12.5px}
.btn{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:7px 13px;border-radius:9px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn .ico{width:16px;height:16px}
.btn:hover{background:var(--sunk)}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0;width:100%}
input[type=checkbox],input[type=radio]{width:auto;accent-color:var(--accent)}
textarea{min-height:70px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--muted);min-width:0}
label.f > span{font-weight:600}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.split{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px}
@media (max-width:1000px){.split{grid-template-columns:minmax(0,1fr)}}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 11px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{background:var(--sunk);font-size:12.5px;color:var(--muted);font-weight:600;white-space:nowrap}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
tr.click{cursor:pointer} tr.click:hover td{background:var(--sunk)}
td input{width:110px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:1px 9px;border-radius:999px;white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.c-ok{background:var(--ok-soft);color:var(--ok)} .c-warn{background:var(--warn-soft);color:var(--warn)} .c-bad{background:var(--bad-soft);color:var(--bad)} .c-info{background:var(--info-soft);color:var(--info)} .c-mute{background:var(--mute-soft);color:var(--muted)} .c-brass{background:var(--brass-soft);color:var(--brass)}
.fchips{display:flex;gap:6px;flex-wrap:wrap}
.fchips button{font:inherit;font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:4px 12px;cursor:pointer}
.fchips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.fchips b{font-family:var(--f-num);font-weight:600;margin-left:4px}
.floor{display:flex;flex-direction:column;gap:8px}
.floor > h4{margin:0;font-size:13px;color:var(--muted);font-weight:600;letter-spacing:.02em;display:flex;align-items:center;gap:8px}
.floor > h4::after{content:"";flex:1;height:1px;background:var(--line)}
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.room{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 12px 10px;cursor:pointer;display:flex;flex-direction:column;gap:3px;text-align:left;font:inherit;color:inherit;box-shadow:var(--shadow);overflow:hidden;min-height:104px}
.room::before{content:"";position:absolute;inset:0 0 auto;height:4px;background:var(--line)}
.room:hover{border-color:var(--accent)}
.room.s-occupied::before{background:var(--ok)} .room.s-vacant::before{background:var(--info)} .room.s-maintenance::before{background:var(--warn)} .room.s-owing::before{background:var(--bad)}
.room .no{font-family:var(--f-head);font-size:20px;line-height:1.2}
.room .tn{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.room .owe{font-size:12px;color:var(--bad);font-weight:600}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.note{border-radius:10px;padding:10px 14px;font-size:13.5px;display:flex;gap:8px;align-items:flex-start}
.note.warn{background:var(--warn-soft);color:var(--warn)} .note.bad{background:var(--bad-soft);color:var(--bad)} .note.good{background:var(--ok-soft);color:var(--ok)}
.note.info{background:var(--info-soft);color:var(--info)}
.empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r);background:var(--surface)}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.step{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.step .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--sunk);color:var(--muted);flex:0 0 auto;font-family:var(--f-num)}
.step.done .n{background:var(--ok);color:#fff}
.step b{display:block}
.todo{display:flex;flex-direction:column}
.todo > div{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.todo > div:last-child{border-bottom:0}
.todo .cnt{font-family:var(--f-num);font-weight:600;min-width:28px;text-align:right}
.ov{position:fixed;inset:0;background:rgba(8,20,15,.5);z-index:20;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:max(24px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 24px max(12px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);border-radius:14px;width:min(800px,100%);padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 18px 50px rgba(0,0,0,.3)}
.mhead{display:flex;align-items:center;gap:10px}
.mfoot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:10px;font-weight:600;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast.bad{background:var(--bad);color:#fff}
.chart svg{width:100%;height:auto;display:block}
.hb{display:flex;flex-direction:column;gap:8px}
.hbr{display:grid;grid-template-columns:minmax(80px,32%) 1fr auto;gap:10px;align-items:center;font-size:13.5px}
.hbl{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbt{height:12px;background:var(--sunk);border-radius:6px;overflow:hidden;display:block}
.hbt span{display:block;height:100%;border-radius:6px}
.hbv{min-width:70px;text-align:right}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.ring{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.ring svg{width:130px;height:130px;flex:0 0 auto}
.ring .lg{display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.insp td select{width:120px} .insp td input{width:100%}
.sum{display:grid;grid-template-columns:1fr auto;gap:5px 16px;font-size:14px}
.sum .t{font-weight:700;border-top:1px solid var(--line);padding-top:6px}
.tenant-card{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.avatar{width:48px;height:48px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--f-head);font-size:20px}
.qr{width:150px;height:150px;object-fit:contain;border:1px solid var(--line);border-radius:10px;background:#fff;max-width:100%}
@media (max-width:560px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.kpi{grid-template-columns:1fr;padding:12px}.kpi .ki{grid-row:auto;width:32px;height:32px}td input{width:84px}.kpi b{font-size:18px}.tb h1{font-size:18px}}

/* Colour themes (per device). green = original tokens above. */
:root[data-skin="blue"]{--bg:#eef2f8;--surface:#ffffff;--sunk:#e3e9f3;--line:#d0d9e6;--fg:#142033;--muted:#5a6779;--accent:#1f5fbf;--accent-2:#2f78e0;--accent-fg:#ffffff;--accent-soft:#dbe7fa;--rail:#0f2a52;--rail-fg:#c9d8f0;--rail-sel:#1d3d6e}

:root[data-skin="purple"]{--bg:#f2eff7;--surface:#ffffff;--sunk:#e8e3f0;--line:#d9d2e6;--fg:#1d1630;--muted:#665d78;--accent:#6b3fb5;--accent-2:#8455d0;--accent-fg:#ffffff;--accent-soft:#ebe2f8;--rail:#2c1a4f;--rail-fg:#d8ccef;--rail-sel:#432a70}
@media (prefers-color-scheme:dark){:root[data-skin="purple"]:not([data-theme="light"]){--bg:#120f19;--surface:#1a1624;--sunk:#231d30;--line:#33293f;--fg:#ebe5f5;--muted:#a69cb8;--accent:#b28cf0;--accent-2:#8455d0;--accent-fg:#140d20;--accent-soft:#2e2247;--rail:#0f0b18;--rail-fg:#c5b6e0;--rail-sel:#2a1f40}}
:root[data-skin="purple"][data-theme="dark"]{--bg:#120f19;--surface:#1a1624;--sunk:#231d30;--line:#33293f;--fg:#ebe5f5;--muted:#a69cb8;--accent:#b28cf0;--accent-2:#8455d0;--accent-fg:#140d20;--accent-soft:#2e2247;--rail:#0f0b18;--rail-fg:#c5b6e0;--rail-sel:#2a1f40}
:root[data-skin="orange"]{--bg:#f7f2ee;--surface:#ffffff;--sunk:#eee6df;--line:#e0d4ca;--fg:#261a12;--muted:#75655a;--accent:#b8520b;--accent-2:#e06a1b;--accent-fg:#ffffff;--accent-soft:#fbe5d3;--rail:#4a2208;--rail-fg:#f0d6c2;--rail-sel:#6b3414}
@media (prefers-color-scheme:dark){:root[data-skin="orange"]:not([data-theme="light"]){--bg:#16110d;--surface:#1f1813;--sunk:#29201a;--line:#3a2e25;--fg:#f2e9e2;--muted:#b3a395;--accent:#ff9a52;--accent-2:#e06a1b;--accent-fg:#1a0e05;--accent-soft:#452810;--rail:#120c08;--rail-fg:#e0c6b0;--rail-sel:#3a2414}}
:root[data-skin="orange"][data-theme="dark"]{--bg:#16110d;--surface:#1f1813;--sunk:#29201a;--line:#3a2e25;--fg:#f2e9e2;--muted:#b3a395;--accent:#ff9a52;--accent-2:#e06a1b;--accent-fg:#1a0e05;--accent-soft:#452810;--rail:#120c08;--rail-fg:#e0c6b0;--rail-sel:#3a2414}

/* flat rate, or tiered (progressive) rate: each tier = {upto: cumulative units (blank = no limit), rate} */
function utilAmt(units,mode,rate,tiers){
  const ts=(tiers||[]).filter(t=>N(t.rate)>0);
  if(mode!=='tier'||!ts.length)return{amt:Math.round(units*N(rate)),note:'',avg:N(rate)};
  let left=units,prev=0,amt=0;const parts=[];
  for(const t of ts){const cap=N(t.upto)>0?N(t.upto):Infinity;const q=Math.max(0,Math.min(left,cap-prev));
    if(q>0){amt+=q*N(t.rate);parts.push(fmt(q)+'×'+fmt(t.rate));left-=q}prev=Math.max(prev,cap);if(left<=0)break}
  if(left>0){const lr=N(ts[ts.length-1].rate);amt+=left*lr;parts.push(fmt(left)+'×'+fmt(lr))}
  return{amt:Math.round(amt),note:parts.join(' + '),avg:units?Math.round(amt/units):0};
}

function localDB(){
  const KEY='kgsRentLocalDB';let data={};try{data=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(_){data={}}
  const subs=[];const clone=x=>x==null?x:JSON.parse(JSON.stringify(x));
  const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch(_){throw{code:'quota_exceeded'}}};
  const coll=c=>(data[c]=data[c]||{});const fire=()=>setTimeout(()=>subs.forEach(f=>f()),0);
  const docRef=path=>{const i=path.lastIndexOf('/');const c=path.slice(0,i),id=path.slice(i+1);return{
    set:async d=>{coll(c)[id]=clone(d);save();fire()},
    update:async d=>{if(!coll(c)[id])throw{code:'not_found'};Object.assign(coll(c)[id],clone(d));save();fire()},
    delete:async()=>{delete coll(c)[id];save();fire()},
    onSnapshot:fn=>{const run=()=>{const d=coll(c)[id];fn({exists:!!d,data:()=>clone(d),metadata:{fromCache:false}})};subs.push(run);setTimeout(run,0);return()=>{}}}};
  const query=(c,o)=>({orderBy:(f,dir)=>query(c,{...o,order:[f,dir]}),limit:n=>query(c,{...o,limit:n}),doc:id=>docRef(c+'/'+id),
    add:async d=>{const id=uid();coll(c)[id]=clone(d);save();fire();return{id}},
    onSnapshot:fn=>{const run=()=>{let docs=Object.entries(coll(c)).map(([id,d])=>({id,data:()=>clone(d)}));
      if(o.order){const[f,dir]=o.order;docs.sort((a,b)=>{const x=a.data()[f]||'',y=b.data()[f]||'';return(x<y?-1:x>y?1:0)*(dir==='desc'?-1:1)})}
      if(o.limit)docs=docs.slice(0,o.limit);fn({docs,metadata:{fromCache:false}})};subs.push(run);setTimeout(run,0);return()=>{}}});
  return{collection:c=>query(c,{}),doc:docRef,local:true};
}

async function W(fn,ok){

/* ---------- invoice building ---------- */
function buildInvoice(room,lease,period,wCur,eCur,opt){
  opt=opt||{};const c=cfg();const D=dim(period);
  const pStart=period+'-01',pEnd=period+'-'+pad(D);
  const s=lease.start>pStart?Number(lease.start.slice(8)):1;
  const endD=opt.endDate&&opt.endDate<=pEnd?Number(opt.endDate.slice(8)):D;
  const days=Math.max(0,endD-s+1);const f=days/D;const part=days<D;
  const pr=prevReading(lease);
  const lines=[];
  const rent=N(lease.rent!=null?lease.rent:room.rent);
  lines.push({kind:'rent',desc:'ຫ້ອງ '+room.no+(part?` (${days}/${D} ມື້)`:''),qty:1,price:Math.round(rent*f),amt:Math.round(rent*f)});
  const wu=Math.max(0,N(wCur)-pr.w),eu=Math.max(0,N(eCur)-pr.e);
  const wa=utilAmt(wu,c.waterMode,c.waterRate,c.waterTiers),ea=utilAmt(eu,c.elecMode,c.elecRate,c.elecTiers);
  lines.push({kind:'water',desc:`ນ້ຳ ${fmt(pr.w)} → ${fmt(wCur)} = ${fmt(wu)} ມ³`+(wa.note?` (ຂັ້ນໄດ: ${wa.note})`:''),qty:wu,price:wa.avg,amt:wa.amt});
  lines.push({kind:'elec',desc:`ໄຟຟ້າ ${fmt(pr.e)} → ${fmt(eCur)} = ${fmt(eu)} kWh`+(ea.note?` (ຂັ້ນໄດ: ${ea.note})`:''),qty:eu,price:ea.avg,amt:ea.amt});
  if(N(c.garbageFee)>0)lines.push({kind:'garbage',desc:'ຄ່າຂີ້ເຫຍື້ອ'+(part?` (${days}/${D} ມື້)`:''),qty:1,price:Math.round(N(c.garbageFee)*f),amt:Math.round(N(c.garbageFee)*f)});
  const eq=room.equip||{};
  (c.equip||[]).forEach(it=>{const e=eq[it.key];if(e&&e.charge&&N(it.monthly)>0){const q=Math.max(1,N(e.qty)||1);const a=Math.round(q*N(it.monthly)*f);lines.push({kind:'equip',desc:it.name+(q>1?' × '+q:'')+(part?` (${days}/${D} ມື້)`:''),qty:q,price:N(it.monthly),amt:a})}});
  const chg=S.charges.filter(x=>x.leaseId===lease.id&&x.chargeTenant&&x.status==='open'&&N(x.amount)>0);
  chg.forEach(x=>lines.push({kind:'repair',desc:x.item+(x.desc?' – '+x.desc:'')+' ('+dLabel(x.date)+')',qty:1,price:N(x.amount),amt:N(x.amount),chargeId:x.id}));
  (opt.extra||[]).forEach(l=>lines.push(l));
  const total=lines.reduce((a,l)=>a+N(l.amt),0);
  const due=opt.final?(opt.endDate||today()):nextMonth(period)+'-'+pad(Math.min(28,Math.max(1,N(c.dueDay)||5)));
  return{no:'INV-'+period.replace('-','')+'-'+room.no+(opt.final?'-F':''),period,roomId:room.id,roomNo:room.no,leaseId:lease.id,tenantName:lease.tenant.name,
    issueDate:today(),dueDate:due,water:{prev:pr.w,cur:N(wCur),units:wu,rate:wa.avg},elec:{prev:pr.e,cur:N(eCur),units:eu,rate:ea.avg},
    lines,total,paid:0,status:'unpaid',payments:[],final:!!opt.final,createdBy:S.me||'',createdAt:new Date().toISOString(),chargeIds:chg.map(x=>x.id),...(lease.demo?{demo:true}:{})};
}
async function saveInvoice(inv){
  const id=inv.no.replace(/[^A-Za-z0-9_-]/g,'_');
  const ex=S.invoices.find(i=>i.id===id);
  if(ex&&ex.status!=='void')throw{code:'dup',message:'dup'};
  if(ex)inv.no=inv.no+'-'+uid().slice(-3).toUpperCase();
  const realId=inv.no.replace(/[^A-Za-z0-9_-]/g,'_');
  await db.doc('invoices/'+realId).set(inv);
  for(const cid of inv.chargeIds||[]){await db.doc('charges/'+cid).update({status:'billed',invoiceNo:inv.no,...stamp()})}
  await audit('ອອກໃບບິນ',inv.no,'ຫ້ອງ '+inv.roomNo+' · '+fmt(inv.total)+' '+CUR);
  return realId;
}

/* ---------- charts ---------- */
function barChart(groups,series,unit,W=640,H=230){
  const L=46,B=34,T=14,R=10;const max=Math.max(1,...groups.flatMap(g=>series.map(s=>N(g[s.k]))));
  const step=Math.pow(10,Math.floor(Math.log10(max)));const top=Math.ceil(max/step)*step;const iw=W-L-R,ih=H-T-B;const gw=iw/groups.length;const bw=Math.min(26,(gw-14)/series.length);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${_T("ກຣາຟ")}">`;
  for(let k=0;k<=4;k++){const y=T+ih-ih*k/4;s+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" style="stroke:var(--line)" stroke-width="1"/><text x="${L-6}" y="${y+4}" text-anchor="end">${short(top*k/4)}</text>`}
  groups.forEach((g,gi)=>{const x0=L+gi*gw+(gw-bw*series.length-4*(series.length-1))/2;
    series.forEach((se,si)=>{const v=N(g[se.k]);const h=ih*v/top;const x=x0+si*(bw+4);s+=`<rect x="${x}" y="${T+ih-h}" width="${bw}" height="${Math.max(0,h)}" rx="3" style="fill:var(${se.c})"><title>${esc(se.l)}: ${fmt(v)} ${unit}</title></rect>`});
    s+=`<text x="${L+gi*gw+gw/2}" y="${H-12}" text-anchor="middle">${esc(g.label)}</text>`});
  return s+'</svg>';
}
function hbar(items,color,unit,empty){
  if(!items.length)return`<div class="muted small">${empty||(_T("ບໍ່ມີຂໍ້ມູນ"))}</div>`;
  const max=Math.max(1,...items.map(x=>N(x.v)));
  return`<div class="hb">${items.map(x=>`<div class="hbr" title="${esc(x.l)}: ${fmt(x.v)} ${unit}"><span class="hbl">${esc(x.l)}</span><span class="hbt"><span style="width:${Math.max(N(x.v)>0?1.5:0,N(x.v)/max*100)}%;background:var(${x.c||color})"></span></span><span class="hbv num">${fmt(x.v)}</span></div>`).join('')}</div>`;
}
function lineChart(pts,color,unit,max){
  const W=470,H=240,L=40,B=30,T=18,R=12;const top=max||Math.max(1,...pts.map(p=>N(p.v)));const iw=W-L-R,ih=H-T-B;const n=pts.length;
  const X=i=>L+(n<2?iw/2:iw*i/(n-1)),Y=v=>T+ih-ih*N(v)/top;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${_T("ກຣາຟເສັ້ນ")}">`;
  for(let k=0;k<=4;k++){const y=T+ih-ih*k/4;s+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" style="stroke:var(--line)" stroke-width="1"/><text x="${L-6}" y="${y+4}" text-anchor="end">${unit==='%'?Math.round(top*k/4)+'%':short(top*k/4)}</text>`}
  const d=pts.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(p.v).toFixed(1)).join(' ');
  s+=`<path d="${d} L${X(n-1).toFixed(1)} ${T+ih} L${X(0).toFixed(1)} ${T+ih}Z" style="fill:var(${color});opacity:.12"/><path d="${d}" fill="none" style="stroke:var(${color})" stroke-width="2.2" stroke-linejoin="round"/>`;
  pts.forEach((p,i)=>{s+=`<circle cx="${X(i)}" cy="${Y(p.v)}" r="${i===n-1?5:3.5}" style="fill:var(${color});stroke:var(--surface)" stroke-width="2"><title>${esc(p.label)}: ${unit==='%'?Math.round(p.v)+'%':fmt(p.v)+' '+unit}</title></circle>${(n-1-i)%2===0?`<text x="${X(i)}" y="${H-10}" text-anchor="middle">${esc(p.label)}</text>`:''}`});
  const lp=pts[n-1];if(lp)s+=`<text x="${Math.min(X(n-1),W-R-4)}" y="${Math.max(12,Y(lp.v)-10)}" text-anchor="end" style="fill:var(--fg);font-weight:600">${unit==='%'?Math.round(lp.v)+'%':short(lp.v)}</text>`;
  return s+'</svg>';
}
function ring(parts,total,center,sub){
  const r=48,C=2*Math.PI*r;let off=0;let s=`<svg viewBox="0 0 130 130"><circle cx="65" cy="65" r="${r}" fill="none" style="stroke:var(--sunk)" stroke-width="16"/>`;
  parts.forEach(p=>{if(!p.v||!total)return;const len=C*p.v/total;s+=`<circle cx="65" cy="65" r="${r}" fill="none" style="stroke:var(${p.c})" stroke-width="16" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 65 65)"/>`;off+=len});
  return s+`<text x="65" y="66" text-anchor="middle" style="fill:var(--fg);font-family:var(--f-num);font-size:22px;font-weight:600">${center}</text><text x="65" y="84" text-anchor="middle" style="fill:var(--muted);font-size:11px">${sub}</text></svg>`;
}

function addMonths(d,n){const[y,m,dd]=d.split('-').map(Number);const t=new Date(y,m-1+Number(n||0),1);const last=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();return t.getFullYear()+'-'+pad(t.getMonth()+1)+'-'+pad(Math.min(dd,last))}

function shrinkPhoto(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=rej;fr.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{
  let out='';for(const[mx,q] of [[1280,.72],[1000,.62],[800,.55],[640,.5]]){const sc=Math.min(1,mx/Math.max(im.width,im.height));const cv=document.createElement('canvas');cv.width=Math.round(im.width*sc);cv.height=Math.round(im.height*sc);
    const x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,cv.width,cv.height);x.drawImage(im,0,0,cv.width,cv.height);out=cv.toDataURL('image/jpeg',q);if(out.length<=330000)break}res(out)};im.src=fr.result};fr.readAsDataURL(file)})}

function profitRows(p){return last12(p).map(m=>{

  const ex=S.expenses.filter(x=>(x.date||'').startsWith(m)).reduce((a,x)=>a+N(x.amount),0);
  const rep=S.charges.filter(c=>(c.date||'').startsWith(m)).reduce((a,c)=>a+N(c.cost),0);
  return{m,label:mShort(m)+' '+m.slice(2,4),inc,ex,rep,out:ex+rep,net:inc-ex-rep}})}
function netChart(rows,W=1100,H=250){
  const L=56,B=34,T=16,R=10;const mx=Math.max(1,...rows.map(r=>Math.abs(r.net)));const step=Math.pow(10,Math.floor(Math.log10(mx)));const top=Math.ceil(mx/step)*step;
  const hasNeg=rows.some(r=>r.net<0);const lo=hasNeg?-top:0;const iw=W-L-R,ih=H-T-B;const Y=v=>T+ih*(top-v)/(top-lo);const gw=iw/rows.length,bw=Math.min(30,gw-16);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${_T("ກຳໄລສຸດທິ")}">`;
  const ticks=hasNeg?[-top,-top/2,0,top/2,top]:[0,top/4,top/2,top*3/4,top];
  ticks.forEach(v=>{s+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" style="stroke:var(${v===0?'--muted':'--line'})" stroke-width="${v===0?1.4:1}"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end">${v<0?'−':''}${short(Math.abs(v))}</text>`});
  rows.forEach((r,i)=>{const x=L+i*gw+(gw-bw)/2,y0=Y(0),y1=Y(r.net);const neg=r.net<0;
    s+=`<rect x="${x}" y="${Math.min(y0,y1)}" width="${bw}" height="${Math.max(r.net?1:0,Math.abs(y1-y0))}" rx="3" style="fill:var(${neg?'--bad':'--ok'})"><title>${esc(r.label)}: ${neg?'−':''}${fmt(Math.abs(r.net))} ${CUR}</title></rect>`;
    s+=`<text x="${L+i*gw+gw/2}" y="${H-12}" text-anchor="middle">${esc(r.label)}</text>`});
  return s+'</svg>';
}

/* water/electricity use vs the previous invoice: flags +50% or more (possible leak) */
function usageNote(l,x){
  if(!l||!x)return'';const pr=prevReading(l);const last=liveInv().filter(i=>i.leaseId===l.id).sort((a,b)=>a.period<b.period?1:-1)[0];if(!last)return'';
  const out=[];[['w','water',(_T("ນ້ຳ"))],['e','elec',(_T("ໄຟ"))]].forEach(([k,f,lab])=>{const v=x[k];if(v===undefined||v==='')return;const u=N(v)-(k==='w'?pr.w:pr.e);const pu=N(last[f]&&last[f].units);
    if(pu>0&&u>pu*1.5)out.push(`<span class="flag" title="${_T("ເດືອນກ່ອນ")} ${fmt(pu)} ${_T("→ ເດືອນນີ້")} ${fmt(u)}">${lab} +${Math.round((u/pu-1)*100)}%</span>`)});
  return out.length?'<br>'+out.join(''):'';
}

async function billRoom(rid,silent){

function backupFromLocal(d){const arr=k=>Object.entries(d[k]||{}).map(([id,x])=>({id,...x}));return{exportedAt:new Date().toISOString(),cfg:(d.cfg||{}).main||null,rooms:arr('rooms'),leases:arr('leases'),invoices:arr('invoices'),charges:arr('charges'),expenses:arr('expenses'),pm:arr('pm'),audit:arr('audit')}}
/* sends a backup to Supabase in parts of at most 150 records / ~1.5 MB */
async function importBackup(B,source,skipDemo){
  const docs=[];['rooms','leases','invoices','charges','expenses','pm'].forEach(k=>(B[k]||[]).forEach(x=>{if(!x||!x.id)return;if(skipDemo&&x.demo)return;const{id,...data}=x;docs.push({coll:k,id:String(id),data})}));
  if(B.cfg&&typeof B.cfg==='object'){const{id,...c}=B.cfg;docs.push({coll:'cfg',id:'main',data:c})}
  const aud=(B.audit||[]).filter(a=>a&&(!skipDemo||!a.demo)).map(a=>({at:a.at,by:nameOf(a.by),action:a.action,ref:a.ref,detail:a.detail}));
  let i=0,n=0,na=0;while(i<docs.length){const part=[];let size=0;while(i<docs.length&&part.length<150){const s=JSON.stringify(docs[i]).length;if(part.length&&size+s>1500000)break;size+=s;part.push(docs[i++])}
    const r=await RAPI('import',{source,docs:part,audit:i>=docs.length?aud.slice(0,2000):[]});n+=r.imported;na+=r.auditImported}
  if(!docs.length&&aud.length){const r=await RAPI('import',{source,docs:[],audit:aud.slice(0,2000)});na+=r.auditImported}
  await db.pull(true);return{n,na};
}

function coPlan(rid){
  const r=roomById(rid),l=activeLease(r),pr=prevReading(l);
  const date=val('co-date'),w=val('co-w'),e=val('co-e');
  if(!date||w===''||e===''){toast((_T("ໃສ່ວັນ ແລະ ເລກມິເຕີສຸດທ້າຍ")),'bad');return null}
  if(N(w)<pr.w||N(e)<pr.e){toast((_T("ເລກມິເຕີນ້ອຍກວ່າຄັ້ງກ່ອນ")),'bad');return null}
  if(date<l.start){toast((_T("ວັນຍ້າຍອອກກ່ອນວັນຍ້າຍເຂົ້າ")),'bad');return null}
  const period=date.slice(0,7);
  const already=liveInv().find(i=>i.leaseId===l.id&&i.period===period&&!i.final);
  const items=readInsp('co',true);
  const extra=items.filter(x=>x.amt>0).map(x=>({kind:'damage',desc:x.item+' – '+COND[x.cond]+(x.note?' ('+x.note+')':''),qty:1,price:x.amt,amt:x.amt}));
  if(N(val('co-clean'))>0)extra.push({kind:'other',desc:'ຄ່າທຳຄວາມສະອາດ',qty:1,price:N(val('co-clean')),amt:N(val('co-clean'))});
  const inv=buildInvoice(r,l,period,w,e,{final:true,endDate:date,extra});
  if(already){inv.lines=inv.lines.filter(x=>x.kind!=='rent'&&x.kind!=='garbage'&&x.kind!=='equip');inv.total=inv.lines.reduce((a,x)=>a+N(x.amt),0)}
  const open=liveInv().filter(i=>i.leaseId===l.id&&invBal(i)>0).sort((a,b)=>a.period<b.period?-1:1);
  const owed=open.reduce((a,i)=>a+invBal(i),0)+inv.total;
  const dep=l.depositPaid?N(l.deposit):0;
  return{r,l,inv,items,open,owed,dep,refund:Math.max(0,dep-owed),due:Math.max(0,owed-dep),date};
}

async function saveCheckout(){
  const P=MODAL&&MODAL.co;if(!P){toast((_T("ກົດ “ຄຳນວນ” ກ່ອນ")),'bad');return}
  const{r,l,inv,items,open,dep}=P;
  const ok=await W(async()=>{
    const invId=await saveInvoice(inv);
    let left=dep;const list=[...open.map(i=>({id:i.id,no:i.no,bal:invBal(i),pays:i.payments||[],paid:N(i.paid),total:N(i.total)})),{id:invId,no:inv.no,bal:inv.total,pays:[],paid:0,total:inv.total}];
    for(const x of list){if(left<=0)break;const a=Math.min(left,x.bal);if(a<=0)continue;left-=a;
      const py={no:x.no+'-R'+(x.pays.length+1),date:P.date,amount:a,method:'ຫັກເງິນມັດຈຳ',ref:'ມັດຈຳ '+l.tenant.name,by:S.me||'',at:new Date().toISOString()};
      const paid=x.paid+a;await db.doc('invoices/'+x.id).update({payments:[...x.pays,py],paid,status:paid>=x.total?'paid':'partial',...stamp()});}
    await db.doc('leases/'+l.id).update({status:'ended',checkOut:{date:P.date,waterEnd:N(val('co-w')),elecEnd:N(val('co-e')),items,finalInvoice:inv.no,depositUsed:dep-left,refund:P.refund,due:P.due,by:S.me||''},...stamp()});
    await db.doc('rooms/'+r.id).update({leaseId:'',status:items.some(x=>x.cond!=='ok')?'maintenance':'vacant',...stamp()});
    await audit('ຍ້າຍອອກ','ຫ້ອງ '+r.no,l.tenant.name+' · ຄືນມັດຈຳ '+fmt(P.refund)+' · ຄ້າງ '+fmt(P.due));
  },(_T("ບັນທຶກຍ້າຍອອກແລ້ວ")));
  if(ok)closeModal();
}

async function pay(id){
  const i=S.invoices.find(x=>x.id===id);const bal=invBal(i);const amt=N(val('py-amt'));
  if(amt<=0){toast((_T("ໃສ່ຈຳນວນເງິນ")),'bad');return} if(amt>bal){toast((_T("ຈຳນວນເກີນຍອດຄ້າງ")+" ")+fmt(bal),'bad');return}
  const py={no:i.no+'-R'+((i.payments||[]).length+1),date:val('py-date')||today(),amount:amt,method:val('py-method'),ref:val('py-ref'),by:S.me||'',at:new Date().toISOString()};
  const paid=N(i.paid)+amt;
  if(await W(async()=>{await db.doc('invoices/'+id).update({payments:[...(i.payments||[]),py],paid,status:paid>=N(i.total)?'paid':'partial',...stamp()});await audit('ຮັບເງິນ',py.no,fmt(amt)+' · '+py.method+(py.ref?' · '+py.ref:''))},(_T("ຮັບເງິນແລ້ວ ·")+" ")+py.no))closeModal();
}
async function addLate(id){
  const i=S.invoices.find(x=>x.id===id);const lf=lateFee(i);if(lf<=0)return;
  const line={kind:'late',desc:'ຊ້າ '+daysBetween(i.dueDate,today())+' ມື້ (ກຳນົດ '+dLabel(i.dueDate)+')',qty:1,price:lf,amt:lf};
  const total=N(i.total)+lf;
  if(await W(async()=>{await db.doc('invoices/'+id).update({lines:[...i.lines,line],total,status:N(i.paid)>0?'partial':'unpaid',...stamp()});await audit('ເພີ່ມຄ່າປັບ',i.no,fmt(lf))},(_T("ເພີ່ມຄ່າປັບແລ້ວ"))))closeModal();
}
async function voidInv(id){
  const reason=val('void-reason');if(reason.length<5){toast((_T("ໃສ່ເຫດຜົນ (ຢ່າງໜ້ອຍ 5 ຕົວ)")),'bad');return}
  const i=S.invoices.find(x=>x.id===id);
  if(await W(async()=>{await db.doc('invoices/'+id).update({status:'void',voidReason:reason,voidBy:S.me||'',voidAt:new Date().toISOString()});
    for(const cid of i.chargeIds||[]){if(S.charges.some(c=>c.id===cid))await db.doc('charges/'+cid).update({status:'open',invoiceNo:'',...stamp()})}

}

function shrinkImage(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=rej;fr.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{const m=360,s=Math.min(1,m/Math.max(im.width,im.height));const cv=document.createElement('canvas');cv.width=Math.round(im.width*s);cv.height=Math.round(im.height*s);const x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,cv.width,cv.height);x.drawImage(im,0,0,cv.width,cv.height);res(cv.toDataURL('image/png'))};im.src=fr.result};fr.readAsDataURL(file)})}

async function saveCharge(id){

  let status=old&&old.status==='billed'?'billed':val('ch-status');if(ct&&status==='done'&&!(old&&old.status==='billed'))status='open';

  const cid=id||('C'+uid());
  if(await W(async()=>{await db.doc('charges/'+cid).set(doc);await audit(id?'ແກ້ງານສ້ອມແປງ':'ບັນທຶກງານສ້ອມແປງ','ຫ້ອງ '+r.no,doc.item+' · ຕົ້ນທຶນ '+fmt(doc.cost)+(doc.chargeTenant?' · ເກັບ '+fmt(doc.amount):''))},(_T("ບັນທຶກແລ້ວ"))))closeModal();

/* ---------- settings save ---------- */
function readCfg(){
  const c=cfg();const n={...c};
  ['name','phone','address','payInfo','invoiceNote','docNo','docRev','contractDocNo','lateMode'].forEach(k=>{const e=document.getElementById('c-'+k);if(e)n[k]=e.value.trim()});
  const ct=document.getElementById('c-contractTerms');if(ct)n.contractTerms=ct.value;
  ['garbageFee','dueDay','lateAmount','lateGrace'].forEach(k=>{if(document.getElementById('c-'+k))n[k]=N(val('c-'+k))});
  ['water','elec'].forEach(k=>{if(!document.getElementById('c-'+k+'Mode'))return;n[k+'Mode']=val('c-'+k+'Mode')||'flat';n[k+'Rate']=N(val('c-'+k+'Rate'));const ts=[];
    for(let i=0;i<6;i++){const r=N(val('t-'+k+'-r-'+i));if(r>0)ts.push({upto:N(val('t-'+k+'-u-'+i)),rate:r})}
    for(let i=0;i<ts.length-1;i++){if(!(ts[i].upto>0)||(i&&ts[i].upto<=ts[i-1].upto)){n._tierErr=true}}n[k+'Tiers']=ts});
  n.equip=c.equip.map((e,k)=>({key:e.key,name:val('eq-n-'+k)||e.name,monthly:document.getElementById('eq-p-'+k)?N(val('eq-p-'+k)):N(e.monthly)}));
  n.damage=c.damage.map((e,k)=>({name:val('dm-n-'+k)||e.name,price:document.getElementById('dm-p-'+k)?N(val('dm-p-'+k)):N(e.price)})).filter(x=>x.name);
  const xc=document.getElementById('c-expCats');if(xc){const l=[...new Set(xc.value.split('\n').map(x=>x.trim()).filter(Boolean))].slice(0,40);if(l.length)n.expCats=l}
  return n;
}

  if(!db&&RENT_API){S.remote=true;S.isAdmin=false;S.canWrite=false;render();
    if(!TOK){showLogin();return}
    try{const r=await RAPI('me',{});setUser(r.user);if(r.user.mustChange){askNewPassword(true);return}await enterApp()}catch(e){if(e.code!=='AUTH'&&e.code!=='MUST_CHANGE'){showLogin(errText(e));if(e.code==='unavailable'||e.code==='SERVER')connCheck()}}
    return}
  if(!db){db=localDB();S.local=true;S.isAdmin=true;S.canWrite=true;user=null}
  if(user){try{S.me=await user.id();S.isAdmin=!!(await user.canEdit());const w=await user.can('data.write');S.canWrite=w===false?false:true}catch(_){}}
  startData();
})();
function startData(){
  const timer=setTimeout(()=>{if(S.status==='loading'){S.status='slow';schedule()}},10000);
  const need=['cfg','rooms','leases','invoices','charges'];
  const done=k=>{S.loaded[k]=true;if(need.every(x=>S.loaded[x])){clearTimeout(timer);S.status='ok'}schedule()};
  const fail=k=>e=>{clearTimeout(timer);S.status='slow';console.warn(k,e);schedule()};
  const coll=(k,q)=>q.onSnapshot(s=>{S[k]=s.docs.map(d=>({id:d.id,...d.data()}));if(!s.metadata.fromCache)done(k);else schedule()},fail(k));
  db.doc('cfg/main').onSnapshot(s=>{S.cfg=s.exists?s.data():null;if(!s.metadata.fromCache)done('cfg');else schedule()},fail('cfg'));
  coll('rooms',db.collection('rooms'));coll('leases',db.collection('leases'));coll('invoices',db.collection('invoices'));coll('charges',db.collection('charges'));
  const opt=k=>db.collection(k).onSnapshot(s=>{S[k]=s.docs.map(d=>({id:d.id,...d.data()}));schedule()},e=>console.warn(k,e));opt('expenses');opt('pm');
  db.collection('audit').orderBy('at','desc').limit(300).onSnapshot(s=>{S.audit=s.docs.map(d=>({id:d.id,...d.data()}));schedule()},()=>{});
}
</script>
