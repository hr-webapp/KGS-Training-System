<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KGS HR Training</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Lao:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>/* Database: Google Sheet KGS_HR_Training_DB via Apps Script Web App (R1.7 deployment) */
window.KGS_API_URL='https://script.google.com/macros/s/AKfycbxByYpkAPPZvDJ6i_iMaOOOq74Iwt9n7YtWVIRRHBOYwzNWMe16IFGh95ANmB6cqaPg/exec';</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--f:'Inter','Noto Sans Lao',system-ui,sans-serif;--radius:16px;color-scheme:dark;
--ink:#eaf0fa;--muted:#9aa8c0;--line:rgba(255,255,255,.14);--line2:rgba(255,255,255,.07);
--glass:rgba(255,255,255,.065);--glass2:rgba(255,255,255,.11);--glass-strong:rgba(16,24,46,.78);--field:rgba(255,255,255,.06);--opt-bg:#16213d;
--brand:#38bdf8;--brand2:#0ea5e9;--brandg:linear-gradient(135deg,#38bdf8 0%,#2563eb 100%);--glow:0 6px 24px rgba(56,189,248,.35);
--danger:#f87171;--warn:#fbbf24;--ok:#34d399;--info:#60a5fa;--shadow:0 12px 40px rgba(0,0,0,.35);--blur:saturate(160%) blur(18px);
--bgimg:radial-gradient(1100px 700px at 8% 8%,rgba(56,189,248,.30),transparent 60%),radial-gradient(900px 650px at 92% 12%,rgba(139,92,246,.28),transparent 60%),radial-gradient(1000px 700px at 75% 100%,rgba(16,185,129,.20),transparent 60%),radial-gradient(700px 500px at 20% 95%,rgba(236,72,153,.14),transparent 60%),linear-gradient(160deg,#0b1532 0%,#060a1a 100%)}
:root[data-theme=light]{color-scheme:light;--ink:#15213b;--muted:#5d6b84;--line:rgba(255,255,255,.75);--line2:rgba(21,33,59,.08);
--glass:rgba(255,255,255,.52);--glass2:rgba(255,255,255,.72);--glass-strong:rgba(255,255,255,.88);--field:rgba(255,255,255,.7);--opt-bg:#fff;
--brand:#2563eb;--brand2:#1d4ed8;--brandg:linear-gradient(135deg,#3b82f6 0%,#1d4ed8 100%);--glow:0 6px 20px rgba(37,99,235,.28);
--danger:#dc2626;--warn:#b45309;--ok:#059669;--info:#2563eb;--shadow:0 10px 30px rgba(30,60,120,.14);
--bgimg:radial-gradient(1100px 700px at 5% 0%,rgba(125,211,252,.55),transparent 60%),radial-gradient(900px 650px at 95% 10%,rgba(196,181,253,.45),transparent 60%),radial-gradient(1000px 700px at 70% 100%,rgba(253,186,116,.35),transparent 60%),linear-gradient(160deg,#dce8f7 0%,#f2f5fb 100%)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:var(--f);font-size:14px;color:var(--ink);background:var(--bgimg);background-attachment:fixed}
button,input,select,textarea{font-family:inherit;font-size:14px;color:inherit}
a{color:var(--brand)}
:root[data-theme=light][data-tone=mint]{--brand:#0f9f6e;--brand2:#047857;--brandg:linear-gradient(135deg,#34d399 0%,#059669 100%);--glow:0 6px 20px rgba(5,150,105,.28);
--bgimg:radial-gradient(1100px 700px at 5% 0%,rgba(110,231,183,.55),transparent 60%),radial-gradient(900px 650px at 95% 10%,rgba(103,232,249,.45),transparent 60%),radial-gradient(1000px 700px at 70% 100%,rgba(190,242,100,.30),transparent 60%),linear-gradient(160deg,#dff3ec 0%,#f3faf7 100%)}
:root[data-theme=light][data-tone=lavender]{--brand:#7c3aed;--brand2:#6d28d9;--brandg:linear-gradient(135deg,#a78bfa 0%,#7c3aed 100%);--glow:0 6px 20px rgba(124,58,237,.28);
--bgimg:radial-gradient(1100px 700px at 5% 0%,rgba(196,181,253,.6),transparent 60%),radial-gradient(900px 650px at 95% 10%,rgba(249,168,212,.45),transparent 60%),radial-gradient(1000px 700px at 70% 100%,rgba(165,180,252,.40),transparent 60%),linear-gradient(160deg,#ece6fb 0%,#f8f5fd 100%)}
:root[data-theme=light][data-tone=sunrise]{--brand:#ea580c;--brand2:#c2410c;--brandg:linear-gradient(135deg,#fb923c 0%,#ea580c 100%);--glow:0 6px 20px rgba(234,88,12,.28);
--bgimg:radial-gradient(1100px 700px at 5% 0%,rgba(253,186,116,.55),transparent 60%),radial-gradient(900px 650px at 95% 10%,rgba(252,165,165,.40),transparent 60%),radial-gradient(1000px 700px at 70% 100%,rgba(253,224,71,.35),transparent 60%),linear-gradient(160deg,#fbeee2 0%,#fdf8f3 100%)}
:root[data-theme=light][data-tone=white]{--brand:#4f46e5;--brand2:#4338ca;--brandg:linear-gradient(135deg,#6366f1 0%,#4338ca 100%);--glow:0 4px 14px rgba(79,70,229,.22);
--glass:rgba(255,255,255,.92);--glass2:#f4f6fa;--glass-strong:#fff;--line:#e5e8ef;--line2:#eef0f4;--field:#fff;--shadow:0 1px 3px rgba(16,24,40,.06),0 6px 16px rgba(16,24,40,.05);
--bgimg:linear-gradient(180deg,#f5f7fb 0%,#eef1f6 100%)}
.hidden{display:none!important}
.ico{width:18px;height:18px;flex-shrink:0;display:block}
.glass{background:var(--glass);border:1px solid var(--line);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);box-shadow:var(--shadow)}
/* layout */
.app{display:flex;min-height:100vh;gap:18px;padding:16px}
.side{width:248px;flex-shrink:0;display:flex;flex-direction:column;position:sticky;top:16px;height:calc(100vh - 32px);border-radius:22px;
  background:var(--glass);border:1px solid var(--line);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);box-shadow:var(--shadow)}
.brand{padding:18px 18px 14px;display:flex;gap:12px;align-items:center}
.logo{width:40px;height:40px;border-radius:12px;background:var(--brandg);box-shadow:var(--glow);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:13px;letter-spacing:.5px}
.brand b{display:block;font-size:15px}
.brand small{color:var(--muted);font-size:11.5px}
.navlbl{padding:6px 22px 4px;font-size:10.5px;letter-spacing:1.2px;color:var(--muted);text-transform:uppercase}
.nav{padding:4px 12px;overflow:auto;flex:1}
.nav a{display:flex;gap:11px;align-items:center;padding:10px 12px;border-radius:12px;color:var(--ink);text-decoration:none;margin-bottom:6px;cursor:pointer;
  background:var(--glass);border:1px solid var(--line2);transition:background .15s,transform .15s,box-shadow .15s;font-weight:500}
.nav a:hover{background:var(--glass2);transform:translateX(2px)}
.nav a .ico{opacity:.85}
.nav a.on{background:var(--brandg);color:#fff;border-color:transparent;box-shadow:var(--glow)}
.nav a.on .ico{opacity:1}
.side-foot{padding:12px 14px 14px;border-top:1px solid var(--line2);display:flex;flex-direction:column;gap:10px}
.me{display:flex;gap:10px;align-items:center}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--brandg);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}
.me b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.me small{color:var(--muted);font-size:11.5px}
.footrow{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:var(--muted)}
.main{flex:1;min-width:0;display:flex;flex-direction:column;gap:16px}
.top{border-radius:20px;padding:14px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:16px;z-index:5;
  background:var(--glass);border:1px solid var(--line);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);box-shadow:var(--shadow)}
.ttl{flex:1;min-width:0}
.top h1{font-size:21px;margin:0;font-weight:700;letter-spacing:-.2px}
.top .sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.burger{display:none;background:none;border:0;cursor:pointer;padding:4px}
.iconbtn{width:38px;height:38px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;background:var(--glass);border:1px solid var(--line)}
.iconbtn:hover{background:var(--glass2)}
.content{width:100%;max-width:1500px}
/* ui */
.btn{border:1px solid var(--line);background:var(--glass);color:var(--ink);padding:8px 14px;border-radius:11px;cursor:pointer;font-weight:500;white-space:nowrap;
  display:inline-flex;gap:6px;align-items:center;justify-content:center;backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);transition:background .15s}
.btn:hover{background:var(--glass2)}
.btn.pri{background:var(--brandg);border-color:transparent;color:#fff;box-shadow:var(--glow)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.danger{color:var(--danger);border-color:rgba(248,113,113,.4)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.card{background:var(--glass);border:1px solid var(--line);border-radius:var(--radius);padding:18px;backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);box-shadow:var(--shadow)}
.card h3{margin:0 0 14px;font-size:15.5px;font-weight:650}
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.kpi{background:var(--glass);border:1px solid var(--line);border-radius:var(--radius);padding:16px;backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;inset:0 0 auto 0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent)}
.kh{display:flex;gap:10px;align-items:center}
.kic{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;color:#fff;background:var(--c,#38bdf8);box-shadow:0 6px 18px color-mix(in srgb,var(--c,#38bdf8) 45%,transparent)}
.kpi .l{color:var(--muted);font-size:12.5px;font-weight:500}
.kpi .v{font-size:30px;font-weight:750;margin-top:10px;letter-spacing:-.5px}
.kpi .s{font-size:11.5px;color:var(--muted);margin-top:2px}
.two{grid-template-columns:repeat(auto-fit,minmax(360px,1fr))}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.bar .grow{flex:1}
.in,select.in,textarea.in{border:1px solid var(--line);border-radius:11px;padding:8px 11px;background:var(--field);min-width:0;color:var(--ink);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
.in::placeholder{color:var(--muted)}
.in:focus{outline:2px solid color-mix(in srgb,var(--brand) 45%,transparent);border-color:var(--brand)}
select option{background:var(--opt-bg);color:var(--ink)}
.search{min-width:240px}
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
.tbl{width:100%;border-collapse:collapse}
.tbl th{background:var(--glass2);text-align:left;font-weight:600;font-size:12px;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
.tbl th.sortable{cursor:pointer}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line2);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--glass2)}
.tbl td.num{text-align:right;font-variant-numeric:tabular-nums}
.empty{text-align:center;color:var(--muted);padding:28px!important}
.tbl-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 4px;color:var(--muted);font-size:12px;flex-wrap:wrap}
.pager{display:flex;gap:4px}
.pager button{border:1px solid var(--line);background:var(--glass);border-radius:8px;padding:3px 10px;cursor:pointer}
.pager button.on{background:var(--brandg);color:#fff;border-color:transparent}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap;border:1px solid transparent}
.b-Planning{background:rgba(148,163,184,.18);color:#cbd5e1;border-color:rgba(148,163,184,.3)}
.b-Planned{background:rgba(96,165,250,.18);color:#93c5fd;border-color:rgba(96,165,250,.35)}
.b-InProgress,.b-Late,.b-dup{background:rgba(251,191,36,.16);color:#fcd34d;border-color:rgba(251,191,36,.35)}
.b-Completed,.b-Yes,.b-Present,.b-new{background:rgba(52,211,153,.16);color:#6ee7b7;border-color:rgba(52,211,153,.35)}
.b-NotCompleted,.b-No,.b-Absent,.b-error{background:rgba(248,113,113,.16);color:#fca5a5;border-color:rgba(248,113,113,.35)}
.b-Cancelled,.b-same{background:rgba(148,163,184,.14);color:#94a3b8;border-color:rgba(148,163,184,.25)}
.b-Cancelled{text-decoration:line-through}
.b-Postponed{background:rgba(192,132,252,.18);color:#d8b4fe;border-color:rgba(192,132,252,.35)}
.b-Excused,.b-exists{background:rgba(96,165,250,.16);color:#93c5fd;border-color:rgba(96,165,250,.35)}
:root[data-theme=light] .b-Planning{color:#475569}:root[data-theme=light] .b-Planned,:root[data-theme=light] .b-Excused,:root[data-theme=light] .b-exists{color:#1d4ed8}
:root[data-theme=light] .b-InProgress,:root[data-theme=light] .b-Late,:root[data-theme=light] .b-dup{color:#92400e}
:root[data-theme=light] .b-Completed,:root[data-theme=light] .b-Yes,:root[data-theme=light] .b-Present,:root[data-theme=light] .b-new{color:#047857}
:root[data-theme=light] .b-NotCompleted,:root[data-theme=light] .b-No,:root[data-theme=light] .b-Absent,:root[data-theme=light] .b-error{color:#b91c1c}
:root[data-theme=light] .b-Cancelled,:root[data-theme=light] .b-same{color:#64748b}:root[data-theme=light] .b-Postponed{color:#7e22ce}
.muted{color:var(--muted)}.small{font-size:12px}
.warn{color:var(--warn)}.err{color:var(--danger)}.ok-t{color:var(--ok,#16a34a);font-weight:600}
.note{background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.35);border-radius:12px;padding:10px 13px;font-size:13px;margin-bottom:12px}
.note.info{background:rgba(96,165,250,.12);border-color:rgba(96,165,250,.35)}
/* forms */
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px 14px}
.fld label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:500}
.fld .in{width:100%}
.fld.wide{grid-column:1/-1}
.req::after{content:" *";color:var(--danger)}
.chk{display:flex;align-items:center;gap:6px;font-size:13px}
/* modal */
.ov{position:fixed;inset:0;background:rgba(3,7,18,.5);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:flex-start;justify-content:center;z-index:50;padding:30px 12px;overflow:auto}
.modal{background:var(--glass-strong);border:1px solid var(--line);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border-radius:20px;width:100%;max-width:880px;box-shadow:0 30px 80px rgba(0,0,0,.45)}
.modal.sm{max-width:440px}.modal.lg{max-width:1100px}
.mh{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line2)}
.mh h2{margin:0;font-size:16.5px;flex:1}
.mh .x{background:none;border:0;font-size:24px;cursor:pointer;color:var(--muted)}
.mb{padding:20px;max-height:calc(100vh - 200px);overflow:auto}
.mf{padding:12px 20px;border-top:1px solid var(--line2);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.dl{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px 18px;margin-bottom:14px}
.dl>div>span:first-child{display:block;font-size:11px;color:var(--muted);margin-bottom:2px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line2);margin-bottom:14px;flex-wrap:wrap}
.tabs button{border:0;background:none;padding:8px 12px;cursor:pointer;border-bottom:2px solid transparent;color:var(--muted);font-weight:500}
.tabs button.on{border-color:var(--brand);color:var(--brand)}
/* toast/loading */
#toast{position:fixed;right:16px;bottom:16px;z-index:90;display:flex;flex-direction:column;gap:8px}
.t{background:var(--glass-strong);border:1px solid var(--line);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);color:var(--ink);padding:11px 15px;border-radius:12px;max-width:360px;box-shadow:var(--shadow);font-size:13px}
.t.ok{border-left:4px solid var(--ok)}.t.bad{border-left:4px solid var(--danger)}
#loading{position:fixed;inset:0;background:rgba(3,7,18,.25);z-index:80;display:flex;align-items:center;justify-content:center}
.spin{width:40px;height:40px;border:4px solid rgba(255,255,255,.2);border-top-color:var(--brand);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
/* login */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.login .box{background:var(--glass);border:1px solid var(--line);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border-radius:24px;padding:30px;width:100%;max-width:400px;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.login h2{margin:14px 0 4px}.login p{margin:0 0 18px;color:var(--muted);font-size:13px}
.login .fld{margin-bottom:12px}
.langsw{display:flex;gap:4px}
.langsw button{border:1px solid var(--line);background:var(--glass);border-radius:8px;padding:3px 9px;cursor:pointer;font-size:12px}
.langsw button.on{background:var(--brandg);color:#fff;border-color:transparent}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line2);border-left:1px solid var(--line2);background:var(--glass);border-radius:var(--radius);overflow:hidden;backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--line)}
.cal .h{background:var(--glass2);font-size:12px;font-weight:600;padding:8px 2px;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.cal .d{min-height:110px;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);padding:5px;font-size:12px}
.cal .d.out{opacity:.4}
.cal .d.today .n{background:var(--brandg);color:#fff;border-radius:50%;width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;box-shadow:var(--glow)}
.cal .n{font-weight:600;margin-bottom:3px}
.ev{display:block;border-radius:7px;padding:3px 6px;margin-top:3px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11.5px;border-left:3px solid}
.week .d{min-height:230px}
.yeargrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.ymon{padding:12px 14px}
.ymh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;cursor:pointer;padding:4px 6px;border-radius:9px}
.ymh:hover{background:var(--glass2)}
.ygrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;font-size:12px}
.ygrid .yh{color:var(--muted);font-size:10.5px;padding:2px 0;overflow:hidden;white-space:nowrap}
.ygrid .yd{padding:4px 0;border-radius:7px;cursor:pointer;font-variant-numeric:tabular-nums}
.ygrid .yd:hover{background:var(--glass2)}
.ygrid .yd.out{opacity:.25;cursor:default}
.ygrid .yd.has{background:color-mix(in srgb,var(--brand) 18%,transparent);color:var(--brand);font-weight:700}
.ygrid .yd.today{outline:2px solid var(--brand);outline-offset:-2px}
.daylist .ev{white-space:normal;font-size:13px;padding:9px 11px;margin-bottom:7px}
.picklist{max-height:380px;overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--glass)}
.picklist label{display:flex;gap:8px;padding:8px 11px;border-bottom:1px solid var(--line2);cursor:pointer;align-items:center}
.picklist label:hover{background:var(--glass2)}
.picklist label.dis{opacity:.5;cursor:default}
.steps{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.steps span{padding:5px 13px;border-radius:999px;background:var(--glass2);font-size:12px;color:var(--muted);border:1px solid var(--line2)}
.steps span.on{background:var(--brandg);color:#fff;border-color:transparent;box-shadow:var(--glow)}
.chart-box{position:relative;height:270px}
@media (max-width:900px){
  .app{padding:10px;gap:10px}
  .side{position:fixed;left:-280px;top:10px;height:calc(100vh - 20px);z-index:40;transition:left .2s;background:var(--glass-strong)}
  .side.open{left:10px;box-shadow:0 0 0 2000px rgba(0,0,0,.45)}
  .burger{display:block}
  .top{top:10px;padding:12px 14px}.top h1{font-size:17px}.top .sub{display:none}
  .search{min-width:0;flex:1 1 100%}
  .cal .d{min-height:72px}.ev{font-size:10px}
  .two{grid-template-columns:1fr}
}
@media print{

function facetRaw(list){const m={};list.forEach(v=>{const s=String(v??'').trim();if(!s)return;const k=nk(s);const o=m[k]||(m[k]={n:0,s:{}});o.n++;o.s[s]=(o.s[s]||0)+1;});

/* ================= server ================= */
/* Server connection: inside Google Apps Script -> google.script.run;
   page hosted elsewhere (GitHub Pages) -> POST to the Apps Script Web App URL set in config.js (window.KGS_API_URL). */
const hasGas=()=>!!(window.google&&google.script&&google.script.run);
const okUrl=u=>{u=String(u||'').trim();return /^https:\/\/script\.google(usercontent)?\.com\/.+\/exec$/.test(u)?u:'';};
const urlOverride=()=>{try{return okUrl(localStorage.getItem('kgs_api_url'));}catch(e){return '';}};
const apiUrl=()=>urlOverride()||okUrl(window.KGS_API_URL);
/* test a Web App URL: POST 'status' and expect this app's answer */
function testApiUrl(u){u=okUrl(u);if(!u)return Promise.reject({message:t('cn_badUrl')});
  return fetch(u,{method:'POST',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'status',token:'',payload:{}})})
   .then(r=>{if(!r.ok)throw {message:'HTTP '+r.status};return r.json();},()=>{throw {message:t('cn_noReach')};})
   .then(r=>{if(!r||!r.ok||!r.data||!r.data.version)throw {message:t('cn_notApp')};return r.data;},e=>{throw (e&&e.message)?e:{message:t('cn_notApp')};});}
function saveApiUrl(u){try{if(u&&u!==okUrl(window.KGS_API_URL))localStorage.setItem('kgs_api_url',u);else localStorage.removeItem('kgs_api_url');}catch(e){}}
const apiMode=()=>!hasGas()&&!!apiUrl();
function transport(action,payload){
  if(hasGas())return new Promise((res,rej)=>google.script.run.withSuccessHandler(res).withFailureHandler(e=>rej({message:e&&e.message?e.message:String(e)})).api(action,S.token,payload||{}));
  if(apiUrl())return fetch(apiUrl(),{method:'POST',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,token:S.token||'',payload:payload||{}})})
    .then(r=>{if(!r.ok)throw {message:'HTTP '+r.status};return r.json();})
    .catch(e=>{throw {error:e&&e.error||'NET',message:(e&&e.message&&!/fetch|network/i.test(e.message))?e.message:t('netErr')};});
  return Promise.reject({message:t('notConfigured')});
}
function call(action,payload,opt){
  opt=opt||{};
  if(!opt.silent)loading(true);
  return transport(action,payload).then(r=>{if(!opt.silent)loading(false);
      if(!r)throw {message:'No response'};
      if(r.ok)return r.data;
      if(r.error==='AUTH'){toast(t('sessionExpired'),'bad');doLogoutLocal();}
      else if(r.error==='MUST_CHANGE'){renderForceChange();}
      throw r;},
    e=>{if(!opt.silent)loading(false);throw e;});
}
const fail=e=>toast(errText(e),'bad');

/* ================= tables ================= */
function dataTable(id,cols,rows,opt){
  opt=opt||{};
  const st=S.tbl[id]||(S.tbl[id]={p:1,k:opt.sortK||null,d:opt.sortD||1});
  let r=rows.slice();
  if(st.k){const c=cols.find(c=>c.k===st.k);const f=c&&c.sv?c.sv:(x=>x[st.k]);
    r.sort((a,b)=>{const A=f(a),B=f(b);return (typeof A==='number'&&typeof B==='number'?A-B:String(A??'').localeCompare(String(B??''),undefined,{numeric:true}))*st.d;});}
  const ps=opt.ps||25,pages=Math.max(1,Math.ceil(r.length/ps));if(st.p>pages)st.p=pages;
  const sl=opt.noPage?r:r.slice((st.p-1)*ps,st.p*ps);
  let h=`<div class="tbl-wrap"><table class="tbl"><thead><tr>${cols.map(c=>`<th ${c.k&&c.sort!==false?`class="sortable" data-tsort="${id}|${c.k}"`:''}>${c.h!==undefined?c.h:esc(c.l)}${st.k===c.k&&c.k?(st.d>0?' ▲':' ▼'):''}</th>`).join('')}</tr></thead><tbody>`;
  h+=sl.length?sl.map(x=>`<tr ${opt.rowAttr?opt.rowAttr(x):''}>${cols.map(c=>`<td class="${c.cls||''}">${c.r?c.r(x):esc(x[c.k]??'')}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${cols.length}" class="empty">${t('noData')}</td></tr>`;
  h+='</tbody></table></div>';
  let pg='';
  if(!opt.noPage&&pages>1){const P=[];for(let i=1;i<=pages;i++){if(i===1||i===pages||Math.abs(i-st.p)<=2)P.push(i);else if(P[P.length-1]!=='…')P.push('…');}
    pg=`<div class="pager no-print">${P.map(i=>i==='…'?'<span>…</span>':`<button class="${i===st.p?'on':''}" data-tpage="${id}|${i}">${i}</button>`).join('')}</div>`;}
  h+=`<div class="tbl-foot"><span>${t('showing')} ${r.length?((opt.noPage?1:(st.p-1)*ps+1)+'–'+(opt.noPage?r.length:Math.min(st.p*ps,r.length))):0} ${t('of')} ${r.length}</span>${pg}</div>`;
  return h;
}

async function start(){

  if(S.pub===undefined){const P=await urlParams();S.pub=P.ci?P:null;}
  if(S.pub){renderCheckinPublic(S.pub);return;}
  if(S.token){try{await loadAll();return;}catch(e){if(e&&e.error==='MUST_CHANGE')return;S.token=null;}}
  let st;
  if(!hasGas()&&!apiUrl()){renderConnect('');return;}
  try{st=await call('status');}catch(e){if(!hasGas()){renderConnect(e.message);return;}$('#root').innerHTML=`<div class="login"><div class="box"><h2>KGS HR</h2><p class="err">${esc(e.message)}</p></div></div>`;return;}

}

// square crop around the centre, 240 px, JPEG; quality/size lowered until it fits 28 000 characters
function photoFromFile(f){return new Promise((res,rej)=>{
  if(!/^image\/(jpeg|png|webp)$/.test(f.type))return rej(new Error(t('ph_type')));
  if(f.size>15*1024*1024)return rej(new Error(t('ph_big')));
  const fr=new FileReader();fr.onerror=()=>rej(new Error(t('ph_type')));
  fr.onload=()=>{const img=new Image();
    img.onload=()=>{try{const w=img.naturalWidth,h=img.naturalHeight,sq=Math.min(w,h);if(!sq)return rej(new Error(t('ph_type')));
      for(const size of [240,200,160,120]){const c=document.createElement('canvas');c.width=c.height=size;const x=c.getContext('2d');
        x.fillStyle='#fff';x.fillRect(0,0,size,size);x.drawImage(img,(w-sq)/2,(h-sq)/2,sq,sq,0,0,size,size);
        for(const q of [0.85,0.75,0.65,0.55]){const u=c.toDataURL('image/jpeg',q);if(u.length<=28000)return res(u);}}
      rej(new Error(t('ph_big')));}catch(e){rej(new Error(t('ph_type')));}};
    img.onerror=()=>rej(new Error(t('ph_type')));img.src=fr.result;};
  fr.readAsDataURL(f);});}

function calcDuration(){
  const sd=$('#af_StartDate').value,ed=$('#af_EndDate').value||sd,st=$('#af_StartTime').value,et=$('#af_EndTime').value;

  const days=Math.round((parseD(ed)-parseD(sd))/864e5)+1;
  $('#af_DurationDays').value=days;
  if(st&&et){const [h1,m1]=st.split(':').map(Number),[h2,m2]=et.split(':').map(Number);const per=(h2*60+m2-h1*60-m1)/60;
    $('#af_DurationHours').value=per>0?Math.round(per*days*100)/100:'';}
}

const MONTHS={en:['January','February','March','April','May','June','July','August','September','October','November','December'],lo:['ມັງກອນ','ກຸມພາ','ມີນາ','ເມສາ','ພຶດສະພາ','ມິຖຸນາ','ກໍລະກົດ','ສິງຫາ','ກັນຍາ','ຕຸລາ','ພະຈິກ','ທັນວາ']};

  const c=S.cal;if(!c.date)c.date=todayStr();

  const yrs=[...new Set([...S.acts.map(a=>Number(String(a.StartDate).slice(0,4))).filter(y=>y>2000),new Date().getFullYear()-1,new Date().getFullYear(),new Date().getFullYear()+1,cy])].sort((a,b)=>a-b);

  const clampDay=(y,m)=>{const last=new Date(y,m+1,0).getDate();return ymd(new Date(y,m,Math.min(parseD(c.date).getDate(),last)));};
  $('#calY').onchange=()=>{c.date=clampDay(Number($('#calY').value),c.view==='year'?0:parseD(c.date).getMonth());if(c.view==='year')c.date=$('#calY').value+'-01-01';pageCalendar();};

  const evOn=d=>S.acts.filter(a=>a.StartDate&&a.StartDate<=d&&(a.EndDate||a.StartDate)>=d).sort((x,y)=>(x.StartTime||'').localeCompare(y.StartTime||''));

  const d0=parseD(c.date),today=todayStr();

      let g=dn.map(x=>`<span class="yh">${esc(x.slice(0,S.lang==='lo'?2:1))}</span>`).join('');let cur=monStart(first);

    }
    $('#calBody').innerHTML=`<div class="yeargrid">${html}</div>`;
  }else if(c.view==='month'){

    const first=ymd(new Date(d0.getFullYear(),d0.getMonth(),1));let cur=monStart(first);let h=dn.map(x=>`<div class="h">${x}</div>`).join('');

  }

function buildReport(){
  const f=S.f.rep;
  const acts=S.acts.filter(a=>(!f.from||(a.EndDate||a.StartDate)>=f.from)&&(!f.to||a.StartDate<=f.to)&&(!f.dept||nk(a.Department)===f.dept)&&(!f.type||a.Type===f.type)&&(!f.st||a.Status===f.st));
  const ids=new Set(acts.map(a=>a.ActivityID));const live=acts.filter(a=>a.Status!=='Cancelled');
  const P=a=>S.partsByAct[a.ActivityID]||[];
  const grp=(key)=>{const g={};live.forEach(a=>{const k=key(a)||'—';(g[k]=g[k]||[]).push(a);});return Object.keys(g).sort().map(k=>({k,acts:g[k],n:g[k].length,parts:g[k].reduce((s,a)=>s+P(a).length,0),hours:g[k].reduce((s,a)=>s+num(a.DurationHours),0),days:g[k].reduce((s,a)=>s+num(a.DurationDays),0),cost:g[k].reduce((s,a)=>s+num(a.Cost),0),budget:g[k].reduce((s,a)=>s+num(a.Budget),0)}));};
  const N=(k,l,d)=>({k,l,cls:'num',sv:r=>num(r[k]),r:r=>fmtN(r[k],d||0),x:r=>num(r[k])});
  const exclNote=S.lang==='lo'?'ບໍ່ລວມກິດຈະກຳທີ່ຍົກເລີກ.':'Cancelled activities are excluded.';
  switch(f.r){
   case 'r_month':return{note:exclNote,cols:[{k:'k',l:t('month')},N('n',t('count')),N('parts',t('invited')),N('days',t('days'),1),N('hours',t('hours'),1),N('budget',t('budget'),2),N('cost',t('cost'),2)],rows:grp(a=>a.StartDate.slice(0,7))};
   case 'r_dept':return{note:exclNote,cols:[{k:'k',l:fl('Department')},N('n',t('count')),N('parts',t('invited')),N('days',t('days'),1),N('hours',t('hours'),1),N('budget',t('budget'),2),N('cost',t('cost'),2)],rows:grp(a=>a.Department||t('companyWide'))};
   case 'r_emp':return{cols:histCols(true),rows:historyRows(p=>ids.has(p.ActivityID)).sort((a,b)=>a.EmployeeID.localeCompare(b.EmployeeID)||a.StartDate.localeCompare(b.StartDate))};
   case 'r_att':return{note:t('kpiRateNote'),cols:[{k:'ActivityID',l:fl('ActivityID')},{k:'Title',l:fl('Title')},{k:'StartDate',l:fl('StartDate'),r:r=>fmtD(r.StartDate)},{k:'Status',l:fl('Status'),r:r=>badge(r.Status),x:r=>r.Status},N('inv',t('invited')),N('pr',t('present')),N('la',t('late')),N('ab',t('absent')),N('ex',t('excused')),N('pe',t('pending')),{k:'rate',l:t('rate'),cls:'num',sv:r=>r.rate??-1,r:r=>r.rate==null?'—':r.rate+'%',x:r=>r.rate==null?'':r.rate/100}],
     rows:acts.map(a=>{const p=P(a),c=s=>p.filter(x=>x.Attendance===s).length;const pr=c('Present'),la=c('Late'),ab=c('Absent');return{...a,inv:p.length,pr,la,ab,ex:c('Excused'),pe:c(''),rate:pr+la+ab?Math.round((pr+la)*100/(pr+la+ab)):null};})};
   case 'r_comp':return{cols:[{k:'ActivityID',l:fl('ActivityID')},{k:'Title',l:fl('Title')},{k:'StartDate',l:fl('StartDate'),r:r=>fmtD(r.StartDate)},{k:'Status',l:fl('Status'),r:r=>badge(r.Status),x:r=>r.Status},N('inv',t('invited')),N('co',t('completed')),N('nc',tv('Not Completed')),N('pe',t('pending'))],
     rows:acts.map(a=>{const p=P(a);return{...a,inv:p.length,co:p.filter(x=>x.Completion==='Completed').length,nc:p.filter(x=>x.Completion==='Not Completed').length,pe:p.filter(x=>!x.Completion).length};})};
   case 'r_dur':{const m={};S.parts.filter(p=>ids.has(p.ActivityID)&&(p.Attendance==='Present'||p.Attendance==='Late')).forEach(p=>{const a=actById(p.ActivityID);if(a.Status==='Cancelled')return;const r=m[p.EmployeeID]=m[p.EmployeeID]||{EmployeeID:p.EmployeeID,n:0,days:0,hours:0};r.n++;r.days+=num(a.DurationDays);r.hours+=num(a.DurationHours);});
     return{note:S.lang==='lo'?'ນັບສະເພາະ ມາ / ມາຊ້າ.':'Counts only Present / Late attendance.',cols:[{k:'EmployeeID',l:fl('EmployeeID')},{k:'Name',l:fl('Name')},{k:'Division',l:fl('Division')},N('n',t('activitiesAttended')),N('days',t('days'),1),N('hours',t('hours'),1)],
      rows:Object.values(m).map(r=>{const e=empById(r.EmployeeID)||{};return{...r,Name:empName(e),Division:e.Division||''};})};}
   case 'r_cost':{const rows=acts.map(a=>{const n=P(a).length;return{...a,b:num(a.Budget),c:num(a.Cost),v:num(a.Budget)-num(a.Cost),pp:n&&a.Cost?num(a.Cost)/n:0,n};});
     const tot={ActivityID:'TOTAL',Title:'',Type:'',Department:'',n:rows.reduce((s,r)=>s+r.n,0),b:rows.reduce((s,r)=>s+r.b,0),c:rows.reduce((s,r)=>s+r.c,0)};tot.v=tot.b-tot.c;tot.pp=tot.n?tot.c/tot.n:0;
     return{cols:[{k:'ActivityID',l:fl('ActivityID')},{k:'Title',l:fl('Title')},{k:'Type',l:fl('Type'),r:r=>esc(tv(r.Type))},{k:'Department',l:fl('Department')},{k:'Status',l:fl('Status'),r:r=>r.Status?badge(r.Status):'',x:r=>r.Status||''},N('n',t('invited')),N('b',t('budget'),2),N('c',t('cost'),2),N('v',t('variance'),2),N('pp',t('costPerHead'),2)],rows:rows.length?[...rows,tot]:[]};}
   case 'r_up':{const td=todayStr();return{cols:[{k:'StartDate',l:fl('StartDate'),r:r=>fmtD(r.StartDate)},{k:'StartTime',l:fl('StartTime')},{k:'Title',l:fl('Title')},{k:'Type',l:fl('Type'),r:r=>esc(tv(r.Type))},{k:'Trainer',l:fl('Trainer')},{k:'Location',l:fl('Location'),r:r=>esc(tv(r.Location))},{k:'Department',l:fl('Department')},N('n',t('invited')),{k:'Status',l:fl('Status'),r:r=>badge(r.Status),x:r=>r.Status}],
     rows:live.filter(a=>a.StartDate>=td).sort((a,b)=>a.StartDate.localeCompare(b.StartDate)).map(a=>({...a,n:P(a).length}))};}
  }
}

function impLoadSheet(keepHdr){
  const I=S.imp,ws=I.wb.Sheets[I.sheet];
  const text=XLSX.utils.sheet_to_json(ws,{header:1,raw:false,defval:''}),raw=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:''});
  if(!keepHdr||I.hdr==null){I.hdr=0;for(let i=0;i<Math.min(15,text.length);i++){if(text[i].filter(v=>String(v).trim()!=='').length>=3){I.hdr=i;break;}}}
  I.headers=(text[I.hdr]||[]).map(h=>String(h).trim());
  I.dataRows=[];for(let i=I.hdr+1;i<text.length;i++){if(text[i].some(v=>String(v).trim()!==''))I.dataRows.push({excelRow:i+1,text:text[i],raw:raw[i]||[]});}
  I.map={};I.map2={};const used=new Set();const nh=I.headers.map(normH);
  NAME2.forEach(k=>{for(const[a,b]of NAME_PAIRS[k]){const i=nh.indexOf(a),j=nh.indexOf(b);if(i>=0&&j>=0){I.map[k]=i;I.map2[k]=j;used.add(i);used.add(j);break;}}});
  EMP_FIELDS.forEach(k=>{if(I.map[k]>=0)return;let idx=-1;for(const s of SYN[k]){const j=nh.findIndex((h,j)=>h===normH(s)&&!used.has(j));if(j>=0){idx=j;break;}}I.map[k]=idx;if(idx>=0)used.add(idx);});
  I.srcFromSheet=I.map.SourceSheet<0;I.step=2;
}
function normDate(rawV,textV){
  if(rawV===''||rawV==null)return{v:''};
  if(typeof rawV==='number'&&rawV>59&&rawV<80000){const p=XLSX.SSF.parse_date_code(rawV);if(p)return{v:p.y+'-'+pad(p.m)+'-'+pad(p.d)};}
  const s=String(textV||rawV).trim();let m;
  if((m=/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/.exec(s)))return valid(m[1],m[2],m[3],s);
  if((m=/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})$/.exec(s)))return valid(m[3],m[2],m[1],s);
  return{v:s,warn:true};
  function valid(y,mo,d,s){const D=new Date(+y,+mo-1,+d);if(D.getMonth()!==+mo-1||D.getDate()!==+d)return{v:s,warn:true};return{v:y+'-'+pad(+mo)+'-'+pad(+d)};}
}
function cellVal(d,k){const I=S.imp,a=I.map[k],b=I.map2?I.map2[k]:-1;const v=x=>x>=0?String(d.text[x]??'').trim():'';return [v(a),b>=0&&b!==a?v(b):''].filter(Boolean).join(' ').replace(/\s+/g,' ');}
function impPreview(){
  const I=S.imp;if(I.map.EmployeeID<0){toast(fl('EmployeeID')+' → '+t('notMapped'),'bad');return;}
  const rows=I.dataRows.map((d,ix)=>{
    const emp={},warns=[],errors=[];
    EMP_FIELDS.forEach(k=>{const j=I.map[k];if(j<0){emp[k]='';return;}
      if(DATE_FIELDS.includes(k)){const r=normDate(d.raw[j],d.text[j]);emp[k]=r.v;if(r.warn)warns.push(fl(k)+': "'+r.v+'" ?');}
      else emp[k]=cellVal(d,k);});
    if(/^(male|m)$/i.test(emp.Gender))emp.Gender='Male';else if(/^(female|f)$/i.test(emp.Gender))emp.Gender='Female';
    if(emp.EndDate&&!FORMER_RE.test(nk(emp.EmploymentStatus))&&emp.EndDate<=todayStr())warns.push(t('endDateWarn')+' ('+emp.EmploymentStatus+', '+fmtD(emp.EndDate)+')');
    if(I.srcFromSheet&&!emp.SourceSheet)emp.SourceSheet=I.sheet;
    if(!emp.EmployeeID)errors.push(fl('EmployeeID')+' — missing');
    if(!emp.NameEN&&!emp.NameLA)errors.push(fl('NameEN')+' / '+fl('NameLA')+' — missing');
    if(emp.Email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emp.Email))warns.push(fl('Email')+': "'+emp.Email+'" — '+t('badFormat'));
    // keep the original text of the MAPPED columns only (salary, bank, address etc. are never stored)
    const usedCols=new Set();EMP_FIELDS.forEach(k=>{if(I.map[k]>=0)usedCols.add(I.map[k]);if(I.map2[k]>=0)usedCols.add(I.map2[k]);});
    const rawObj={};I.headers.forEach((h,j)=>{if(usedCols.has(j)&&String(d.text[j]??'')!=='')rawObj[h||('col'+(j+1))]=d.text[j];});rawObj._sheet=I.sheet;rawObj._row=d.excelRow;
    return{n:d.excelRow,emp,warns,errors,raw:JSON.stringify(rawObj),key:emp.EmployeeID.toLowerCase(),action:'skip'};
  });
  const cnt={};rows.forEach(r=>{if(r.emp.EmployeeID)cnt[r.key]=(cnt[r.key]||0)+1;});
  const dbIdx={};S.emps.forEach(e=>dbIdx[e.EmployeeID.toLowerCase()]=e);
  rows.forEach(r=>{
    if(r.errors.length){r.st='error';return;}
    if(cnt[r.key]>1){r.st='dup';return;}
    classifyExisting(r,dbIdx);
  });
  I.rows=rows;I.dupPick={};I.tab='all';I.step=3;S.tbl.imp={p:1,k:null,d:1};rerender();
}
function classifyExisting(r,dbIdx){
  const e=dbIdx[r.key];if(!e){r.st='new';return;}
  r.diff=EMP_FIELDS.filter(f=>f!=='EmployeeID'&&r.emp[f]&&r.emp[f]!==(e[f]||'')).map(f=>({f,old:e[f]||'',nw:r.emp[f]}));
  r.st=r.diff.length?'exists':'same';r.action='skip';
}
async function impCommit(){
  const I=S.imp,R=I.rows;
  const dbIdx={};S.emps.forEach(e=>dbIdx[e.EmployeeID.toLowerCase()]=e);
  const inserts=[],updates=[],review=[];let skipped=0;
  const handle=(r)=>{
    const e=dbIdx[r.key];
    if(!e){inserts.push({...r.emp,_raw:r.raw});return;}
    const diff=EMP_FIELDS.filter(f=>f!=='EmployeeID'&&r.emp[f]&&r.emp[f]!==(e[f]||''));
    if(!diff.length)return 'same';
    if(r.action==='fill'||r.action==='overwrite'){updates.push({employee:{...r.emp,_raw:r.raw},mode:r.action});return;}
    skipped++;review.push({EmployeeID:r.emp.EmployeeID,Reason:'Employee ID exists in database with different data',Resolution:'Skipped (not imported)',raw:r.raw});
  };
  R.filter(r=>r.st==='new'||r.st==='exists').forEach(handle);
  const groups={};R.filter(r=>r.st==='dup').forEach(r=>(groups[r.key]=groups[r.key]||[]).push(r));
  Object.entries(groups).forEach(([k,g])=>{const pick=I.dupPick[k];
    g.forEach(r=>{if(pick===r.n){const res=handle(r);if(res==='same'){}}
      else{skipped++;review.push({EmployeeID:r.emp.EmployeeID,Reason:`Duplicate Employee ID in file (${g.length} rows)`,Resolution:pick?`Not imported — row ${pick} used`:'Not imported — pending HR review',raw:r.raw});}});});
  const errs=R.filter(r=>r.st==='error');
  const msg=`${t('inserted')}: ${inserts.length} · ${t('updated')}: ${updates.length} · ${t('skippedN')}: ${skipped} · ${t('errorsN')}: ${errs.length}`;
  if(!await ask(t('confirmImport')+'? '+msg))return;
  try{
    const res=await call('import.commit',{batch:'IMP-'+todayStr().replace(/-/g,'')+'-'+Date.now().toString().slice(-5),fileName:I.fileName,sheetName:I.sheet,inserts,updates,review,skippedCount:skipped});
    res.errorsTotal=errs.length+res.errors.length;
    I.result=res;I.issues=[...errs.map(r=>({row:r.n,id:r.emp.EmployeeID,issue:r.errors.join('; ')})),...res.errors.map(x=>({row:'',id:x.id,issue:x.msg})),...review.map(x=>({row:JSON.parse(x.raw)._row,id:x.EmployeeID,issue:x.Reason+' — '+x.Resolution})),...R.filter(r=>r.warns.length&&r.st!=='error').map(r=>({row:r.n,id:r.emp.EmployeeID,issue:'Warning: '+r.warns.join('; ')}))];
    I.step=4;await loadAll();go('import');toast(msg,'ok');
  }catch(e){fail(e);}
}

function logoFromFile(f){return new Promise((res,rej)=>{
  if(!/^image\/(png|jpeg|webp|svg\+xml)$/.test(f.type))return rej(new Error(t('ad_logoType')));
  if(f.size>5*1024*1024)return rej(new Error(t('ad_logoBig')));
  const fr=new FileReader();fr.onerror=()=>rej(new Error(t('ad_logoType')));
  fr.onload=()=>{const img=new Image();
    img.onload=()=>{try{
      let w=img.naturalWidth||256,h=img.naturalHeight||256;const sc=Math.min(1,256/Math.max(w,h));w=Math.max(1,Math.round(w*sc));h=Math.max(1,Math.round(h*sc));
      const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
      let u=c.toDataURL('image/png');
      if(u.length>300000){const wq=c.toDataURL('image/webp',0.9);u=/^data:image\/webp/.test(wq)&&wq.length<=300000?wq:c.toDataURL('image/jpeg',0.85);}
      if(u.length>380000)return rej(new Error(t('ad_logoBig')));
      res(u);}catch(e){rej(new Error(t('ad_logoType')));}};
    img.onerror=()=>rej(new Error(t('ad_logoType')));img.src=fr.result;};

  o.frequency.value=ok?880:220;g.gain.value=.08;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+(ok?.12:.3));}catch(e){}}

async function ciCamera(){
  try{await needLib('jsqr');}catch(e){toast(e.message,'bad');return;}
  modal(t('ci_camera'),`<div class="ci-cam"><video id="scVid" playsinline muted></video><div class="ci-aim"></div></div><p class="small muted" id="scMsg" style="text-align:center">${t('ci_camHelp')}</p>
    <label class="btn" style="cursor:pointer;justify-content:center;width:100%">${ic('camera',16)} ${t('ci_photo')}<input type="file" id="scFile" accept="image/*" capture="environment" style="display:none"></label>`,
    `<button class="btn" data-act="closeModal">${t('close')}</button>`,'sm');
  const G=S.ci2;G.scanLast='';G.scanAt=0;
  $('#scFile').onchange=ev=>{const f=ev.target.files[0];ev.target.value='';if(!f)return;const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const cv=document.createElement('canvas');const sc=Math.min(1,1280/Math.max(im.width,im.height));cv.width=im.width*sc;cv.height=im.height*sc;const x=cv.getContext('2d');x.drawImage(im,0,0,cv.width,cv.height);const d=x.getImageData(0,0,cv.width,cv.height);const q=jsQR(d.data,d.width,d.height);if(q&&q.data)ciHr(q.data);else{$('#scMsg').textContent=t('ci_noQr');beep(false);}};im.src=fr.result;};fr.readAsDataURL(f);};
  try{const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});G.stream=st;const v=$('#scVid');if(!v){scanStop();return;}v.srcObject=st;await v.play();
    const cv=document.createElement('canvas'),x=cv.getContext('2d',{willReadFrequently:true});
    const loop=()=>{if(!G.stream||!$('#scVid'))return scanStop();if(v.readyState>=2){cv.width=v.videoWidth;cv.height=v.videoHeight;x.drawImage(v,0,0);const d=x.getImageData(0,0,cv.width,cv.height);const q=jsQR(d.data,d.width,d.height,{inversionAttempts:'dontInvert'});
      if(q&&q.data){const now=Date.now();if(q.data!==G.scanLast||now-G.scanAt>4000){G.scanLast=q.data;G.scanAt=now;ciHr(q.data);}}}
      G.raf=requestAnimationFrame(loop);};loop();}
  catch(e){const m=$('#scMsg');if(m)m.textContent=t('ci_noCam');const v=$('#scVid');if(v)v.parentElement.style.display='none';}
}

   if(!act&&!await ask(t('deactivateConfirm'),{danger:true}))return;
   try{const r=await call('employee.setActive',{id,active:act});Object.assign(e,r);toast(t('saved'),'ok');viewEmp(id);S.refresh&&S.refresh();}catch(err){fail(err);}},
 setActStatus:id=>setActStatus(id,$('#vaSt').value),
 cancelAct:async id=>{const r=await ask(t('cancelActivity')+'?',{input:t('cancelReason'),required:true,danger:true});if(r)setActStatus(id,'Cancelled',r);},

 calNav:d=>{const c=S.cal;d=Number(d);if(!d)c.date=todayStr();else if(c.view==='year'){const x=parseD(c.date);c.date=(x.getFullYear()+d)+'-01-01';}else if(c.view==='month'){const x=parseD(c.date);x.setDate(1);x.setMonth(x.getMonth()+d);c.date=ymd(x);}else c.date=addDays(c.date,d*(c.view==='week'?7:1));pageCalendar();},
 calMonth:d=>{S.cal.date=d;S.cal.view='month';pageCalendar();},
 calView:v=>{S.cal.view=v;pageCalendar();},
 calDay:d=>{S.cal.date=d;S.cal.view='day';pageCalendar();},
 pickParts,saveAtt,
 allPresent:()=>{const a=actById(S.att.actId);(S.partsByAct[a.ActivityID]||[]).forEach(p=>{const cur=S.att.dirty[p.EmployeeID]||{Attendance:p.Attendance,Completion:p.Completion,Certificate:p.Certificate,Remarks:p.Remarks};if(!cur.Attendance){cur.Attendance='Present';S.att.dirty[p.EmployeeID]=cur;}});attBody();},
 removeParts:async()=>{const ids=[...document.querySelectorAll('.atChk:checked')].map(c=>c.value);if(!ids.length)return;

 exportActs:()=>{const rows=S.page==='activities'?actFilteredList():S.acts;exportXlsx('KGS_Activities',[tableToSheet('Activities',ACT_EXPORT.map(k=>({k,l:fl(k)})).concat([{l:t('participants'),x:a=>(S.partsByAct[a.ActivityID]||[]).length}]),rows)]);},
 exportHist:()=>{const rows=S.page==='history'?histFiltered():historyRows();exportXlsx('KGS_Training_History',[tableToSheet('History',histCols(true).concat([{k:'ActivityID',l:fl('ActivityID')},{k:'Division',l:fl('Division')}]),rows)]);},
 exportOneHist:id=>exportXlsx('KGS_History_'+id,[tableToSheet('History',histCols(true),historyRows(p=>p.EmployeeID===id))]),
 exportReview:async()=>{try{const r=await call('dupReview.list');exportXlsx('KGS_Duplicate_Review',[{name:'Review',head:['Time','ImportBatch','EmployeeID','Reason','Resolution','User','RawData'],rows:r.map(x=>[x.Time,x.ImportBatch,x.EmployeeID,x.Reason,x.Resolution,x.User,x.RawData])}]);}catch(e){fail(e);}},
 exportReport:()=>{const R=buildReport();exportXlsx('KGS_Report_'+S.f.rep.r,[tableToSheet(t(S.f.rep.r),R.cols,R.rows)]);},
 printReport:()=>window.print(),
 impReset:()=>{S.imp=null;rerender();},impBack:()=>{S.imp.step=2;rerender();},impPreview,impCommit,
 impTab:s=>{S.imp.tab=s;S.tbl.imp.p=1;impRender();},
 impIssues:()=>exportXlsx('KGS_Import_Issues',[{name:'Issues',head:['Excel row','Employee ID','Issue'],rows:(S.imp.issues||[]).map(x=>[x.row,x.id,x.issue])}]),
 changePw:async()=>{const o=$('#pwOld').value,n=$('#pwNew').value;if(n.length<Number(cfg('pwMinLen')))return toast(pwShortMsg(),'bad');if(n!==$('#pwNew2').value)return toast(t('pwMismatch'),'bad');
   try{const r=await call('changeOwnPassword',{oldPassword:o,newPassword:n});S.token=r.token;try{localStorage.setItem('kgs_hr_token',r.token);}catch(e){}toast(t('saved'),'ok');['pwOld','pwNew','pwNew2'].forEach(i=>$('#'+i).value='');}catch(e){fail(e);}},
 userForm:id=>userForm(id||null),
 resetPw:id=>resetPwForm(id),
 unlockUser:async id=>{const u=S.users.find(x=>x.UserID===id);if(!u||!await ask(t('ad_unlockQ')+' ('+u.Username+')'))return;
   try{const r=await call('users.unlock',{userId:id});Object.assign(u,r);toast(t('saved'),'ok');S.refresh&&S.refresh();}catch(e){fail(e);}},
 ciOpen:async v=>{const G=S.ci2,a=actById(G.actId);if(!a)return;const open=v==='1';
   if(!open&&!await ask(t('ci_closeQ')))return;
   try{const r=await call('checkin.setOpen',{id:a.ActivityID,open});Object.assign(a,r);ciStop();toast(t('saved'),'ok');pageCheckin();}catch(e){fail(e);}},
 ciPresent,ciPresentClose:()=>{const d=$('#ciPresent');if(d)d.remove();},
 ciCopy:()=>{const l=S.ci2&&S.ci2.link;if(!l)return;const done=()=>toast(t('copied'),'ok');try{navigator.clipboard.writeText(l).then(done,()=>{prompt('',l);});}catch(e){prompt('',l);}},
 ciTry:()=>{const l=S.ci2&&S.ci2.link;if(l)window.open(l,'_blank');},
 ciScanGo:()=>ciHr($('#ciScan').value),ciCamera,
 ciGo:id=>{closeModal();S.ci2=S.ci2||{};S.ci2.actId=id;go('checkin');},
 printBadges:()=>printBadges(empFiltered()),
 printBadgesGo:()=>{document.body.classList.add('printing-badges');const done=()=>{document.body.classList.remove('printing-badges');window.removeEventListener('afterprint',done);};window.addEventListener('afterprint',done);window.print();setTimeout(done,60000);},
 photoRemove:async id=>{const e=empById(id);if(!e||!await ask(t('ph_removeQ'),{danger:true}))return;
   try{const r=await call('employee.setPhoto',{id,photo:''});delete S.photos[id];Object.assign(e,r);toast(t('saved'),'ok');viewEmp(id);}catch(err){fail(err);}},
 dashYear:d=>{const f=dashFilter();f.year=String(dashYear()+Number(d));dashBody();},
 admTab:k=>{S.adm.tab=k;pageAdmin();},

 admLogoRemove:()=>{S.adm.draft.logo='';admOrg();},

 admOrgSave:async()=>{const d=S.adm.draft;
   try{const r=await call('settings.save',{settings:{logo:d.logo,sysName:d.sysName,companyLA:d.companyLA,companyEN:d.companyEN,loginBanner:d.loginBanner}});
     S.settings=r;S.adm.draft=null;toast(t('saved'),'ok');renderShell();}catch(e){fail(e);}},

 exportAudit:()=>exportXlsx('KGS_Audit_Log',[{name:'Audit',head:[t('time'),t('user'),t('action'),t('entity'),'ID',t('details')],rows:auditFiltered().map(x=>[x.Time,x.User,x.Action,x.Entity,x.EntityID,String(x.Details).slice(0,32000)])}]),
 exportUsers:()=>exportXlsx('KGS_Users',[{name:'Users',head:[t('username'),t('fullName'),t('email'),t('role'),fl('Status'),t('ad_mustCh'),t('lastLogin'),t('ad_created')],
   rows:S.users.map(u=>[u.Username,u.FullName,u.Email||'',t('r_'+u.Role),t(uState(u)==='active'?'ad_stActive':uState(u)==='locked'?'ad_stLocked':'ad_stDisabled'),u.MustChange==='Yes'?t('yes'):t('no'),u.LastLogin||'',u.CreatedAt||''])}]),
 admBackup:async()=>{try{const d=await call('backup.export');
   const sheets=Object.keys(d.tables).map(n=>{const head=d.heads[n]||(d.tables[n][0]?Object.keys(d.tables[n][0]):[]);
     return{name:n,head,rows:d.tables[n].map(r=>head.map(k=>{const v=r[k]??'';return typeof v==='string'&&v.length>32000?v.slice(0,32000):v;}))};});
   exportXlsx('KGS_HR_Backup',sheets);S.settings=d.settings;toast(t('ad_backupDone'),'ok');admData();}catch(e){fail(e);}},
 loadReview:async()=>{try{const r=await call('dupReview.list',null,{silent:true});const el=$('#review');if(!el)return;el.classList.remove('muted','small');
   el.innerHTML=dataTable('rev',[{k:'Time',l:t('time')},{k:'EmployeeID',l:fl('EmployeeID')},{k:'Reason',l:t('reason')},{k:'Resolution',l:t('resolution')},{k:'ImportBatch',l:'Batch'},{k:'RawData',l:t('rawData'),r:x=>`<span class="small muted">${esc(String(x.RawData).slice(0,160))}</span>`}],r.slice().reverse(),{ps:20});}catch(e){fail(e);}}
};
document.addEventListener('click',ev=>{
  const ts=ev.target.closest('[data-tsort]');if(ts){const[id,k]=ts.dataset.tsort.split('|');const st=S.tbl[id];if(st){st.d=st.k===k?-st.d:1;st.k=k;}tblRefresh(id);return;}
  const tp=ev.target.closest('[data-tpage]');if(tp){const[id,p]=tp.dataset.tpage.split('|');S.tbl[id].p=Number(p);tblRefresh(id);return;}
  const a=ev.target.closest('[data-act]');if(a&&H[a.dataset.act]){ev.preventDefault();H[a.dataset.act](a.dataset.arg);}
  if(ev.target.id==='ov')closeModal();
});
function tblRefresh(id){
  if(id==='ehist'){const m=$('.mb');const sc=m?m.scrollTop:0;S.modalRefresh&&S.modalRefresh();const m2=$('.mb');if(m2)m2.scrollTop=sc;return;}
  if(id==='imp'){impRender();return;}
  if(id==='rev'){H.loadReview();return;}
  S.refresh&&S.refresh();
}
const PAGES={checkin:pageCheckin,dashboard:pageDashboard,employees:pageEmployees,activities:pageActivities,calendar:pageCalendar,attendance:pageAttendance,history:pageHistory,reports:pageReports,import:pageImport,settings:pageSettings,admin:pageAdmin};
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#modalRoot').innerHTML)closeModal();});
applyTheme();
start();
